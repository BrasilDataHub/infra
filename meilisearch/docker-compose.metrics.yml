# Overlay OPCIONAL de métricas do Meilisearch.
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
#
# ÚNICO overlay de métricas que altera o serviço base (recria o container):
# /metrics nativo ligado por env. Índice no volume; interrompe indexação em curso.
#
# MEILI_EXPERIMENTAL_ENABLE_METRICS: nomes podem mudar; imagem fixa em v1.34.
# Scrape com chave `metrics.get` (não master key) — setup grava em
# monitoring/secrets/meili-metrics.key.

services:
  meilisearch:
    environment:
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    networks:
      # Repetir `default`: declarar networks remove a herança implícita.
      - default
      - bdh_metrics

networks:
  # Sem `external: true` — ver postgres/docker-compose.metrics.yml.
  bdh_metrics:
    name: ${METRICS_NETWORK:-bdh_metrics}
