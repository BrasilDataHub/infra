# Referência de implantação. O perfil é definido pelas envs MEILI_* e
# MEILI_MEMORY_LIMIT — os defaults abaixo são o perfil busca-1gb; blocos por
# perfil (busca-512mb/1gb/4gb/16gb) e a regra de dimensionamento estão
# documentados no README.

services:
  meilisearch:
    image: ghcr.io/brasildatahub/meilisearch:1.34
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?defina MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-1GiB}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-1}
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: ${MEILI_HTTP_PAYLOAD_SIZE_LIMIT:-100MB}
    volumes:
      - meili-data:/meili_data
    deploy:
      resources:
        limits:
          memory: ${MEILI_MEMORY_LIMIT:-1G}
    healthcheck:
      # 127.0.0.1 (não "localhost"): o wget do busybox resolve localhost
      # para ::1 e o Meili escuta só em 0.0.0.0.
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meili-data:
