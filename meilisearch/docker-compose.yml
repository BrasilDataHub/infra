# Compose de PRODUÇÃO do Meilisearch.
#
#   MEILI_MASTER_KEY=...              # ≥ 16 bytes em production
#   MEILI_MAX_INDEXING_MEMORY=1GiB
#   MEILI_MAX_INDEXING_THREADS=1
#   MEILI_MEMORY_LIMIT=1G
#   # BIND_IP=10.0.0.5
#
#   docker compose up -d

services:
  meilisearch:
    image: ghcr.io/brasildatahub/meilisearch:1.34
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?defina MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-1GiB}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-1}
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: ${MEILI_HTTP_PAYLOAD_SIZE_LIMIT:-100MB}
    # consumida pelo `bdh status` e pela mensagem de login (ver setup.sh)
    labels:
      org.brasildatahub.service: meilisearch
    volumes:
      # índice LMDB acessado por mmap — precisa de disco local
      - meili_data:/meili_data
    ports:
      # 0.0.0.0 por default; a master key é a única barreira. Para restringir,
      # defina BIND_IP e/ou limite a origem no firewall.
      - "${BIND_IP:-0.0.0.0}:${MEILI_PORT:-7700}:7700"
    logging:
      # Teto de log (mesmo NVMe do host). Ver ../postgres/docker-compose.yml.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          # ~2× MEILI_MAX_INDEXING_MEMORY durante a indexação (ver README)
          memory: ${MEILI_MEMORY_LIMIT:-1G}
          cpus: "${MEILI_CPU_LIMIT:-0}"
    healthcheck:
      # 127.0.0.1 (não "localhost"): o wget do busybox resolve localhost
      # para ::1 e o Meili escuta só em 0.0.0.0.
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Volume nomeado com driver local; `name` fixo (independente do projeto Compose).
  meili_data:
    driver: local
    name: ${MEILI_VOLUME:-bdh_meili_data}
