# Referência de implantação. Perfil selecionado pelo env_file:
#   PROFILE=busca-512mb | busca-1gb (default) | busca-4gb | busca-16gb
# MEILI_MEMORY_LIMIT deve acompanhar o perfil (512M/1G/4G/16G durante
# indexação) — tabela e regra de dimensionamento no README.

services:
  meilisearch:
    image: ghcr.io/brasildatahub/meilisearch:1.34
    restart: unless-stopped
    env_file:
      - env.${PROFILE:-busca-1gb}
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?defina MEILI_MASTER_KEY}
    volumes:
      - meili-data:/meili_data
    deploy:
      resources:
        limits:
          memory: ${MEILI_MEMORY_LIMIT:-1G}
    healthcheck:
      # 127.0.0.1 (não "localhost"): o wget do busybox resolve localhost
      # para ::1 e o Meili escuta só em 0.0.0.0.
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meili-data:
