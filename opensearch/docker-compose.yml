# Compose de PRODUÇÃO do OpenSearch — roda no bdh-data, ao lado do PostgreSQL.
#
#   docker compose up -d
#
# Antes do primeiro up (sem isso o bootstrap check mata o container):
#   sysctl -w vm.max_map_count=262144
#   echo 'vm.max_map_count=262144' > /etc/sysctl.d/99-opensearch.conf
#
#   OS_MEMORY_LIMIT=8G
#   OS_JAVA_OPTS=-Xms4g -Xmx4g -XX:MaxDirectMemorySize=1g
#   # BIND_IP=10.0.0.5
#   # OPENSEARCH_PORT=9200

services:
  opensearch:
    image: ghcr.io/brasildatahub/opensearch:3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # single-node: sem isso um nó sozinho nunca fica GREEN.
      discovery.type: single-node
      cluster.name: ${OS_CLUSTER_NAME:-bdh}
      # Default neutro — defina OS_NODE_NAME = hostname real do host de busca.
      node.name: ${OS_NODE_NAME:-opensearch}
      OPENSEARCH_JAVA_OPTS: ${OS_JAVA_OPTS:--Xms4g -Xmx4g -XX:MaxDirectMemorySize=1g}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # fielddata 0%: mapping usa doc_values; fielddata = erro de consulta.
      indices.breaker.fielddata.limit: ${OS_BREAKER_FIELDDATA_LIMIT:-0%}
      indices.breaker.total.limit: ${OS_BREAKER_TOTAL_LIMIT:-70%}
      indices.breaker.request.limit: ${OS_BREAKER_REQUEST_LIMIT:-40%}
      # flood_stage 90% → índices read-only (NVMe compartilhado com PGDATA).
      cluster.routing.allocation.disk.watermark.low: ${OS_WATERMARK_LOW:-75%}
      cluster.routing.allocation.disk.watermark.high: ${OS_WATERMARK_HIGH:-85%}
      cluster.routing.allocation.disk.watermark.flood_stage: ${OS_WATERMARK_FLOOD:-90%}
      path.repo: /snapshots
    labels:
      org.brasildatahub.service: opensearch
    ulimits:
      # memlock: pré-requisito de bootstrap.memory_lock (evita swap do heap).
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os_data:/usr/share/opensearch/data
      - os_snapshots:/snapshots
    ports:
      # Security plugin off: sem firewall entrega o índice inteiro.
      - "${BIND_IP:-0.0.0.0}:${OPENSEARCH_PORT:-9200}:9200"
    networks:
      - default
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${OS_MEMORY_LIMIT:-8G}
          cpus: "${OS_CPU_LIMIT:-6}"
    healthcheck:
      # yellow (não green): recuperação de shards passa por yellow.
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  os_data:
    driver: local
    name: ${OS_VOLUME:-bdh_os_data}
  os_snapshots:
    driver: local
    name: ${OS_SNAPSHOT_VOLUME:-bdh_os_snapshots}

networks:
  # Sem `external: true` — ver ../postgres/docker-compose.metrics.yml.
  bdh_metrics:
    name: ${METRICS_NETWORK:-bdh_metrics}
