# =============================================================================
# Redis padrão dos projetos BrasilDataHub — cache + fila (Horizon).
# Papel: cache de aplicação e fila; não precisa de mais que 512 MB.
# =============================================================================

bind 0.0.0.0
port 6379
protected-mode yes

# --- Memória -----------------------------------------------------------------
# Teto explícito: sem ele, o Redis disputa os 8 GB do host com Postgres e
# Meilisearch e o OOM-killer decide quem morre.
maxmemory 512mb

# volatile-lru: despeja SOMENTE chaves com TTL (as de cache). As chaves da
# fila/Horizon não têm TTL e portanto NUNCA são despejadas — é isso que torna
# a política segura para cache+fila na mesma instância. (allkeys-lru poderia
# descartar jobs pendentes; noeviction derrubaria writes de cache no limite.)
maxmemory-policy volatile-lru

# --- Durabilidade ------------------------------------------------------------
# AOF: jobs enfileirados sobrevivem a restart do container.
appendonly yes
appendfsync everysec
dir /data

# --- Operacional -------------------------------------------------------------
tcp-keepalive 300
timeout 0
loglevel notice
