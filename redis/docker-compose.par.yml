# Compose do PAR de instâncias de Redis — cache e fila separados.
#
#   docker compose -f docker-compose.par.yml up -d
#
# Substitui o `docker-compose.yml` de instância única; não é overlay dele.
#
# `maxmemory` e `maxmemory-policy` são por INSTÂNCIA, não por database.
# Políticas distintas:
#   cache (768 MB) → allkeys-lru, sem AOF
#   fila  (256 MB) → noeviction, com AOF
#
# Dois arquivos de env, um por instância:
#   .env.cache   ← redis/profiles/cache-768mb.env + REDIS_PASSWORD
#   .env.fila    ← redis/profiles/fila-256mb.env  + REDIS_PASSWORD
#
# Portas distintas — apontar as duas para a mesma porta mistura cache e fila.

services:
  redis-cache:
    image: ghcr.io/brasildatahub/redis:7
    restart: unless-stopped
    env_file:
      - path: .env.cache
        required: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-768mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      REDIS_APPENDONLY: ${REDIS_APPENDONLY:-no}
    labels:
      org.brasildatahub.service: redis-cache
    # Sem volume: `appendonly no` — não há dump a restaurar.
    ports:
      - "${BIND_IP:-0.0.0.0}:${REDIS_CACHE_PORT:-6379}:6379"
    logging:
      # Teto de log (mesmo NVMe do host). Ver ../postgres/docker-compose.yml.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${REDIS_CACHE_MEMORY_LIMIT:-1G}
          cpus: "${REDIS_CACHE_CPU_LIMIT:-1}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-fila:
    image: ghcr.io/brasildatahub/redis:7
    restart: unless-stopped
    env_file:
      - path: .env.fila
        required: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-noeviction}
      REDIS_APPENDONLY: ${REDIS_APPENDONLY:-yes}
    labels:
      org.brasildatahub.service: redis-fila
    volumes:
      # Volume obrigatório: AOF faz o job sobreviver a restart.
      - redis_fila_data:/data
    ports:
      - "${BIND_IP:-0.0.0.0}:${REDIS_FILA_PORT:-6380}:6379"
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${REDIS_FILA_MEMORY_LIMIT:-512M}
          cpus: "${REDIS_FILA_CPU_LIMIT:-1}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_fila_data:
    driver: local
    name: ${REDIS_FILA_VOLUME:-bdh_redis_fila_data}
