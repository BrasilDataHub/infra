# Overlay OPCIONAL de métricas — acrescenta o redis_exporter.
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
#
# Passar os dois -f: compose base sozinho deixa o exporter órfão sob `--remove-orphans`.
# Serviço `redis` intacto; exporter reusa REDIS_PASSWORD do .env (sem .env.metrics).
# Limitação: requirepass compartilhada (ACL dedicada = rebuild da imagem).

services:
  redis-exporter:
    image: ghcr.io/oliver006/redis_exporter:v1.87.0-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      # LLEN/SCARD em chaves exatas (O(1)). NUNCA CHECK_KEYS/COUNT_KEYS (SCAN)
      # nem EXPORT_CLIENT_LIST (série por cliente Horizon).
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: ${REDIS_METRICS_KEYS:-}
      # Abaixo do scrape_timeout 10s.
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 5s
    labels:
      org.brasildatahub.service: redis-exporter
    # Sem `ports:`: /metrics sem auth; scrape via bdh_metrics.
    networks:
      - default
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${REDIS_EXPORTER_MEMORY_LIMIT:-64M}
          cpus: "${REDIS_EXPORTER_CPU_LIMIT:-0.25}"
    depends_on:
      redis:
        condition: service_healthy

networks:
  # Sem `external: true` — ver postgres/docker-compose.metrics.yml.
  bdh_metrics:
    name: ${METRICS_NETWORK:-bdh_metrics}
