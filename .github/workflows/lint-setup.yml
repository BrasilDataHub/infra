name: Lint e testes do setup.sh

# O script provisiona máquinas como root; um erro de sintaxe ou uma divergência
# entre os perfis embutidos e postgres/docs/perfis.md sai caro em produção.

on:
  push:
    branches: [main]
    paths:
      - "setup.sh"
      - "test/setup.test.sh"
      - "postgres/docs/perfis.md"
      - "*/profiles/*.env"
      - "*/docker-compose.yml"
      - "*/docker-compose.metrics.yml"
      - "postgres/docker-compose.backup*.yml"
      - "monitoring/**"
      - "postgres/initdb/*.sh"
      - "meilisearch/metrics-key.sh"
      - ".github/workflows/lint-setup.yml"
  pull_request:
    paths:
      - "setup.sh"
      - "test/setup.test.sh"
      - "postgres/docs/perfis.md"
      - "*/profiles/*.env"
      - "*/docker-compose.yml"
      - "*/docker-compose.metrics.yml"
      - "postgres/docker-compose.backup*.yml"
      - "monitoring/**"
      - "postgres/initdb/*.sh"
      - "meilisearch/metrics-key.sh"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe
        run: bash -n setup.sh

      - name: ShellCheck
        run: |
          shellcheck -x setup.sh test/setup.test.sh
          shellcheck postgres/initdb/03-role-metrics.sh \
                     meilisearch/metrics-key.sh \
                     monitoring/grafana/vendorizar.sh \
                     monitoring/test/prometheus-config.test.sh

      # Cobre, entre outras coisas, se os blocos PG_* do script continuam
      # idênticos aos de postgres/docs/perfis.md e se as envs existem na imagem.
      - name: Testes
        run: bash test/setup.test.sh

      - name: Re-execução herda o estado
        run: bash test/reexecucao.test.sh

      - name: Ajuda não falha
        run: bash setup.sh --help > /dev/null

      - name: Composes válidos
        run: |
          POSTGRES_DB=d POSTGRES_PASSWORD=p docker compose -f postgres/docker-compose.yml config -q
          REDIS_PASSWORD=x docker compose -f redis/docker-compose.yml config -q
          MEILI_MASTER_KEY=chave-de-teste-com-32-bytes-abc docker compose -f meilisearch/docker-compose.yml config -q

      - name: Composes válidos com o overlay de métricas
        run: |
          POSTGRES_DB=d POSTGRES_PASSWORD=p \
            docker compose -f postgres/docker-compose.yml -f postgres/docker-compose.metrics.yml config -q
          REDIS_PASSWORD=x \
            docker compose -f redis/docker-compose.yml -f redis/docker-compose.metrics.yml config -q
          MEILI_MASTER_KEY=chave-de-teste-com-32-bytes-abc \
            docker compose -f meilisearch/docker-compose.yml -f meilisearch/docker-compose.metrics.yml config -q
          GRAFANA_ADMIN_PASSWORD=x \
            docker compose -f monitoring/docker-compose.yml config -q
          # Com COMPOSE_PROFILES vazio o `config` não enxerga node-exporter nem
          # cAdvisor: sem esta segunda passagem, os dois ficariam sem validação.
          COMPOSE_PROFILES=node,containers GRAFANA_ADMIN_PASSWORD=x \
            docker compose -f monitoring/docker-compose.yml config -q

      - name: Composes válidos dos módulos novos
        run: |
          # O compose do par exige os DOIS arquivos de perfil (required: true),
          # e a exigência é o ponto: sem eles, o deploy subiria com os defaults
          # de instância única — volatile-lru e 512mb — que é exatamente o
          # estado que o item 7 corrige. Aqui eles são só stubs.
          cp redis/profiles/cache-768mb.env redis/.env.cache
          cp redis/profiles/fila-256mb.env  redis/.env.fila
          REDIS_PASSWORD=x docker compose -f redis/docker-compose.par.yml config -q
          rm -f redis/.env.cache redis/.env.fila
          PGB_DB_HOST=10.0.0.1 PGB_DB_NAME=d PGB_USER=u PGB_PASSWORD=p \
            docker compose -f pgbouncer/docker-compose.yml config -q
          POSTGRES_DB=d POSTGRES_PASSWORD=p METRICS_BIND_IP=10.0.0.1 \
            docker compose -f postgres/docker-compose.yml \
                           -f postgres/docker-compose.metrics.yml \
                           -f postgres/docker-compose.metrics-remote.yml config -q
          REDIS_PASSWORD=x METRICS_BIND_IP=10.0.0.1 \
            docker compose -f redis/docker-compose.yml \
                           -f redis/docker-compose.metrics.yml \
                           -f redis/docker-compose.metrics-remote.yml config -q
          docker compose -f opensearch/docker-compose.yml config -q

      - name: Composes válidos com o overlay de backup
        run: |
          POSTGRES_DB=d POSTGRES_PASSWORD=p PGBACKREST_STANZA=dados-cnpj \
            docker compose -f postgres/docker-compose.yml \
                           -f postgres/docker-compose.backup.yml config -q
          # Os três juntos: é assim que o host de produção fica.
          POSTGRES_DB=d POSTGRES_PASSWORD=p PGBACKREST_STANZA=dados-cnpj \
            docker compose -f postgres/docker-compose.yml \
                           -f postgres/docker-compose.metrics.yml \
                           -f postgres/docker-compose.backup.yml config -q

      # O oposto do passo anterior, e igualmente deliberado: o overlay de backup
      # TEM de mudar o serviço `postgres` — `archive_mode` é parâmetro de
      # postmaster. Se um dia ele parar de mudar, o arquivamento não estará
      # ligado e o backup existirá sem PITR, em silêncio.
      - name: Overlay de backup liga o arquivamento no serviço postgres
        run: |
          comb=$(POSTGRES_DB=d POSTGRES_PASSWORD=p PGBACKREST_STANZA=dados-cnpj \
                 docker compose -f postgres/docker-compose.yml \
                                -f postgres/docker-compose.backup.yml config)
          printf '%s' "$comb" | yq -e '.services.postgres.environment.PG_ARCHIVE_MODE == "on"'
          printf '%s' "$comb" | yq -e '.services.postgres.environment.PG_ARCHIVE_COMMAND | test("archive-push")'

      # Repositório LOCAL (repo1-type=posix). O que este passo protege é uma
      # falha silenciosa e cara: com `posix`, o repositório precisa estar montado
      # nos DOIS serviços, porque quem executa `archive-push` é o servidor
      # Postgres, não o sidecar. Montado só no sidecar, o `backup` funciona, o
      # `info` reporta sucesso, e TODO segmento de WAL falha ao ser arquivado —
      # até o pg_wal encher o mesmo NVMe do PGDATA.
      #
      # Com `repo1-type=s3` isso não aparece: os dois falam com o bucket pela
      # rede e nenhum mount é necessário. É exatamente por isso que a regressão
      # passaria despercebida sem este passo.
      - name: Overlay de repositório local monta o repo nos DOIS serviços
        run: |
          comb=$(POSTGRES_DB=d POSTGRES_PASSWORD=p PGBACKREST_STANZA=dados-cnpj \
                 BDH_BACKUP_REPO_DIR=/mnt/bdh-backup/pgbackrest \
                 docker compose -f postgres/docker-compose.yml \
                                -f postgres/docker-compose.backup.yml \
                                -f postgres/docker-compose.backup-local.yml config)
          # o alvo é o caminho de DENTRO do container, nos dois serviços
          printf '%s' "$comb" | yq -e \
            '[.services.postgres.volumes[]   | select(.target == "/var/lib/pgbackrest")] | length == 1'
          printf '%s' "$comb" | yq -e \
            '[.services.pgbackrest.volumes[] | select(.target == "/var/lib/pgbackrest")] | length == 1'
          # e precisa ser gravável: o archive-push escreve aqui
          printf '%s' "$comb" | yq -e \
            '[.services.postgres.volumes[] | select(.target == "/var/lib/pgbackrest" and .read_only == true)] | length == 0'

      # Sem a variável, o overlay tem de RECUSAR a subir. Um default silencioso
      # aqui faria o Docker criar um diretório vazio no disco raiz e o backup
      # rodaria para o lugar errado, enchendo o mesmo NVMe do PGDATA.
      - name: Overlay de repositório local exige BDH_BACKUP_REPO_DIR
        run: |
          if POSTGRES_DB=d POSTGRES_PASSWORD=p PGBACKREST_STANZA=dados-cnpj \
             docker compose -f postgres/docker-compose.yml \
                            -f postgres/docker-compose.backup.yml \
                            -f postgres/docker-compose.backup-local.yml config -q 2>/dev/null; then
            echo "ERRO: o overlay aceitou subir sem BDH_BACKUP_REPO_DIR" >&2
            exit 1
          fi

      # O princípio central desta entrega: ligar métricas não pode recriar um
      # container de banco de centenas de GB. Se alguém acrescentar uma chave ao
      # serviço `postgres` dentro do overlay, ou puser uma variável de métricas
      # no .env do serviço, este passo falha.
      - name: Overlay de métricas não altera o serviço postgres
        run: |
          base=$(POSTGRES_DB=d POSTGRES_PASSWORD=p \
                 docker compose -f postgres/docker-compose.yml config)
          comb=$(POSTGRES_DB=d POSTGRES_PASSWORD=p \
                 docker compose -f postgres/docker-compose.yml -f postgres/docker-compose.metrics.yml config)
          diff <(printf '%s' "$base" | yq '.services.postgres') \
               <(printf '%s' "$comb" | yq '.services.postgres')
          # Idem para o Redis. O Meilisearch é a exceção conhecida: ligar
          # /metrics é uma env do próprio serviço, e recriar é inerente.
          rbase=$(REDIS_PASSWORD=x docker compose -f redis/docker-compose.yml config)
          rcomb=$(REDIS_PASSWORD=x \
                  docker compose -f redis/docker-compose.yml -f redis/docker-compose.metrics.yml config)
          diff <(printf '%s' "$rbase" | yq '.services.redis') \
               <(printf '%s' "$rcomb" | yq '.services.redis')

      - name: Config, alertas e dashboards
        run: bash monitoring/test/prometheus-config.test.sh
