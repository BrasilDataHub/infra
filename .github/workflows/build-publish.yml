name: Build e publica imagens

# Publica as imagens de infraestrutura da organização no GHCR, sob o
# namespace da org (minúsculo, exigência de nome de imagem Docker):
#   ghcr.io/brasildatahub/postgres:17     (imagem única; tuning via envs PG_*)
#   ghcr.io/brasildatahub/pgbackrest:17   (sidecar de backup físico + PITR)
#   ghcr.io/brasildatahub/redis:7
#   ghcr.io/brasildatahub/meilisearch:1.34
#   ghcr.io/brasildatahub/prometheus:3    (config e regras de alerta embutidas)
#   ghcr.io/brasildatahub/grafana:13      (provisioning e dashboards embutidos)
#   ghcr.io/brasildatahub/alertmanager:0  (roteamento, inibição e janela de ETL)
#   ghcr.io/brasildatahub/blackbox-exporter:0 (módulos das classes de SLO)
#   ghcr.io/brasildatahub/pgbouncer:1     (transaction pooling; par do work_mem)
#   ghcr.io/brasildatahub/opensearch:3    (analisadores BR + exporter de métricas)
# Imagens genéricas — consumidas por qualquer projeto da org (baseempresarial,
# baseescolar, basehospitalar, ...). Nada aqui é específico de um projeto.
#
# E as imagens base das APLICAÇÕES, que seguem a mesma regra de genericidade:
#   ghcr.io/brasildatahub/laravel-app:8.4     (FrankenPHP + Octane)
#   ghcr.io/brasildatahub/laravel-worker:8.4  (PHP CLI: fila, Horizon, scheduler)
#   ghcr.io/brasildatahub/laravel-builder:8.4 (Composer + Node/npm, só build)

on:
  push:
    branches: [main]
    paths:
      # Filtros por arquivo que entra na imagem (não `postgres/**` inteiro).
      - "postgres/Dockerfile"
      - "postgres/*.sh"
      - "postgres/backup/Dockerfile"
      - "postgres/backup/*.sh"
      # Teste-gate do sidecar incluído no filtro de paths.
      - "postgres/backup/test/**"
      - "postgres/initdb/**"
      - "postgres/.dockerignore"
      - "postgres/test/**"
      - "redis/Dockerfile"
      - "redis/redis.conf"
      - "pgbouncer/Dockerfile"
      - "pgbouncer/*.sh"
      - "pgbouncer/test/**"
      - "opensearch/Dockerfile"
      - "opensearch/index/**"
      - "opensearch/test/**"
      - "meilisearch/Dockerfile"
      - "monitoring/prometheus/**"
      - "monitoring/grafana/**"
      - "monitoring/alertmanager/**"
      - "monitoring/blackbox/**"
      - "monitoring/test/**"
      # laravel: docs e README não disparam rebuild (extensões PHP são caras).
      - "laravel/Dockerfile.*"
      - "laravel/php-extensions.txt"
      - "laravel/php/**"
      - "laravel/caddy/**"
      - "laravel/entrypoint*.sh"
      - "laravel/.dockerignore"
      - "laravel/test/**"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch:
    inputs:
      servico:
        description: "Qual imagem republicar (todos = o repositório inteiro)"
        type: choice
        default: todos
        options:
          - todos
          - postgres
          - pgbackrest
          - redis
          - pgbouncer
          - opensearch
          - meilisearch
          - monitoring
          - laravel

env:
  REGISTRY: ghcr.io
  NAMESPACE: brasildatahub
  # PHP_MINOR + REVISION: tag imutável compartilhada pelos jobs laravel-*.
  # r3: laravel-worker passou a derivar de laravel-app.
  PHP_MINOR: "8.4"
  REVISION: "r3"

jobs:
  # Filtro por escopo: cada job só roda se o push tocou arquivos da imagem.
  # Mudar este arquivo não republica nada — use workflow_dispatch.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      postgres: ${{ steps.filtro.outputs.postgres }}
      pgbackrest: ${{ steps.filtro.outputs.pgbackrest }}
      redis: ${{ steps.filtro.outputs.redis }}
      pgbouncer: ${{ steps.filtro.outputs.pgbouncer }}
      opensearch: ${{ steps.filtro.outputs.opensearch }}
      meilisearch: ${{ steps.filtro.outputs.meilisearch }}
      monitoring: ${{ steps.filtro.outputs.monitoring }}
      laravel: ${{ steps.filtro.outputs.laravel }}
    steps:
      # fetch-depth: 0 porque o `git diff` abaixo precisa do commit anterior ao
      # push, que um checkout raso não traz.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filtro
        env:
          # Via env, e não interpolado direto no `run`: é a forma segura de
          # levar contexto do evento para dentro do shell.
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          AGORA: ${{ github.sha }}
          ESCOLHA: ${{ inputs.servico }}
        run: |
          set -euo pipefail

          # Os mesmos recortes dos `paths:` do topo, agora por imagem. Cada
          # padrão casa só ARQUIVO QUE ENTRA NA IMAGEM — README e docs de fora.
          # Note `[^/]+\.sh$` no postgres: sem isso ele casaria também
          # `postgres/backup/*.sh`, que é a imagem do pgbackrest, não a dele.
          escopos() {
            cat <<'MAPA'
          postgres|^postgres/(Dockerfile$|[^/]+\.sh$|\.dockerignore$|initdb/|test/)
          pgbackrest|^postgres/backup/(Dockerfile$|[^/]+\.sh$|test/)
          redis|^redis/(Dockerfile|redis\.conf)$
          pgbouncer|^pgbouncer/(Dockerfile$|[^/]+\.sh$|test/)
          opensearch|^opensearch/(Dockerfile$|index/|test/)
          meilisearch|^meilisearch/Dockerfile$
          monitoring|^monitoring/(prometheus/|grafana/|alertmanager/|blackbox/|test/)
          laravel|^laravel/(Dockerfile\.|php-extensions\.txt$|php/|caddy/|entrypoint[^/]*\.sh$|\.dockerignore$|test/)
          MAPA
          }

          publica_tudo() {
            local motivo="$1"
            echo "::notice::$motivo — todas as imagens entram no build."
            while IFS='|' read -r nome _; do
              # `if`, e não `[ ... ] && ...`: sob `set -e`, um `&&` que resulta
              # falso no ÚLTIMO comando do corpo do laço encerraria o script.
              if [ -n "$nome" ]; then
                echo "${nome}=true" >> "$GITHUB_OUTPUT"
              fi
            done < <(escopos)
          }

          if [ "$EVENTO" = "workflow_dispatch" ]; then
              if [ "${ESCOLHA:-todos}" = "todos" ]; then
                  publica_tudo "Execução manual sem filtro"
              else
                  echo "::notice::Execução manual: só ${ESCOLHA}."
                  while IFS='|' read -r nome _; do
                      if [ "$nome" = "$ESCOLHA" ]; then
                          echo "${nome}=true"  >> "$GITHUB_OUTPUT"
                      elif [ -n "$nome" ]; then
                          echo "${nome}=false" >> "$GITHUB_OUTPUT"
                      fi
                  done < <(escopos)
              fi
              exit 0
          fi

          # Fail-safe: sem um ponto de partida válido não dá para saber o que
          # mudou, e deixar de publicar em silêncio é pior do que publicar
          # demais. Acontece em push forçado e no primeiro push de uma branch.
          if [ -z "${ANTES:-}" ] || ! git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
              publica_tudo "Sem commit anterior utilizável ($ANTES)"
              exit 0
          fi

          ARQUIVOS="$(git diff --name-only "$ANTES" "$AGORA")"
          echo "Arquivos no push:"
          echo "$ARQUIVOS" | sed 's/^/  /'

          while IFS='|' read -r nome padrao; do
              [ -n "$nome" ] || continue
              if printf '%s\n' "$ARQUIVOS" | grep -qE "$padrao"; then
                  echo "${nome}=true" >> "$GITHUB_OUTPUT"
                  echo "::notice::${nome}: será publicada."
              else
                  echo "${nome}=false" >> "$GITHUB_OUTPUT"
              fi
          done < <(escopos)

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Roda ANTES do push: o shm-guard decide o paralelismo efetivo da
      # instância, então uma regressão silenciosa aqui volta a expor o erro
      # "could not resize shared memory segment" (ver docs/troubleshooting.md).
      - name: Testes do shm-guard
        run: bash postgres/test/shm-guard.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: postgres
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/postgres:17
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/postgres:17.10

  # Sidecar de backup. Job SEPARADO do postgres e rodando o teste de integração
  # antes do push: o teste sobe banco + sidecar de verdade e percorre
  # archive_command → stanza → full → diff → restore → contagem. É o único
  # ponto do repositório onde "o backup existe" deixa de ser uma afirmação e
  # passa a ser uma verificação.
  pgbackrest:
    needs: changes
    if: needs.changes.outputs.pgbackrest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Ciclo completo de backup e restore
        run: bash postgres/backup/test/backup.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: postgres/backup
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbackrest:17
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbackrest:17.10

  redis:
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: redis
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/redis:7
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/redis:7.4

  # PgBouncer: teste-gate antes do push (transaction pooling + SET/prepared statements).
  pgbouncer:
    needs: changes
    if: needs.changes.outputs.pgbouncer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Pooling, SET LOCAL e prepared statements
        run: bash pgbouncer/test/pgbouncer.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: pgbouncer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbouncer:1
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbouncer:1.24.1

  meilisearch:
    needs: changes
    if: needs.changes.outputs.meilisearch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: meilisearch
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/meilisearch:1.34

  # OpenSearch: mapping imutável validado antes do push.
  opensearch:
    needs: changes
    if: needs.changes.outputs.opensearch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Mapping, analisadores e contratos imutáveis
        run: |
          sudo sysctl -w vm.max_map_count=262144
          bash opensearch/test/opensearch.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: opensearch
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/opensearch:3
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/opensearch:3.3.0

  # Laravel: teste → app (multi-arch nativo) → manifest → derivados.
  # Worker e builder dependem da tag imutável desta execução.
  laravel-teste:
    needs: changes
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Paridade de extensões, diretivas de PHP e toolchain
        run: bash laravel/test/laravel-images.test.sh

  # A única imagem que compila alguma coisa, e por isso a única que ganha um
  # runner por arquitetura. SEM `setup-qemu-action`: se ele aparecer aqui de
  # novo, é sinal de que a emulação voltou.
  laravel-app:
    needs: laravel-teste
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Um manifest com uma arquitetura só é pior do que manifest nenhum: os
      # consumidores da outra caem em emulação sem aviso.
      fail-fast: true
      matrix:
        include:
          - { plataforma: linux/amd64, runner: ubuntu-24.04, arco: amd64 }
          - { plataforma: linux/arm64, runner: ubuntu-24.04-arm, arco: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `push-by-digest`: sobe os blobs SEM criar tag. É o que permite quebrar o
      # build em dois runners sem que exista, em momento algum, uma tag pública
      # apontando para uma imagem de arquitetura única. A tag só nasce no job de
      # manifest, quando as duas metades já estão prontas.
      #
      # O `scope` do cache é por arquitetura: um scope compartilhado faria os
      # dois runners disputarem a mesma chave e se invalidarem em alternância.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: laravel
          file: laravel/Dockerfile.app
          platforms: ${{ matrix.plataforma }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-app,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=laravel-app-${{ matrix.arco }}
          cache-to: type=gha,mode=max,scope=laravel-app-${{ matrix.arco }}

      # O digest vira o NOME de um arquivo vazio: é só isso que o job de
      # manifest precisa saber de cada arquitetura, e assim o artefato não
      # carrega conteúdo nenhum.
      - name: Guarda o digest desta arquitetura
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-laravel-app-${{ matrix.arco }}
          path: /tmp/digests/*
          retention-days: 1
          # Sem isto, uma arquitetura que não produzisse digest passaria
          # despercebida e o manifest sairia com uma metade só.
          if-no-files-found: error

  # Junta os dois digests num manifest multi-arch e é aqui — e só aqui — que as
  # tags de `laravel-app` passam a existir.
  laravel-app-manifest:
    needs: laravel-app
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-laravel-app-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # As duas tags de laravel-app. O `build.sh` da raiz lê estas linhas para
      # saber o que publicar localmente — ver test/catalogo-build.test.sh, que
      # afirma a concordância. Mudar a forma deste comando quebra o teste, que é
      # o ponto: a alternativa seria o script publicar a tag errada em silêncio.
      - name: Manifest multi-arch de laravel-app
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
              -t "${REGISTRY}/${NAMESPACE}/laravel-app:${PHP_MINOR}" \
              -t "${REGISTRY}/${NAMESPACE}/laravel-app:${PHP_MINOR}-${REVISION}" \
              $(printf "${REGISTRY}/${NAMESPACE}/laravel-app@sha256:%s " *)

      - name: Confere as arquiteturas publicadas
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
              "${REGISTRY}/${NAMESPACE}/laravel-app:${PHP_MINOR}-${REVISION}"

  # Worker e builder: os dois fazem `FROM laravel-app`, os dois recebem os
  # mesmos dois build-args e nenhum dos dois compila extensão. Por isso cabem
  # numa matriz e num runner só — a emulação aqui custa segundos, não meia hora.
  #
  # `BASE_TAG` aponta para a tag IMUTÁVEL recém-publicada, e não para a móvel: é
  # o que garante que os derivados desta execução venham da app desta execução.
  laravel-derivados:
    needs: laravel-app-manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        imagem: [worker, builder]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: laravel-${{ matrix.imagem }}
        uses: docker/build-push-action@v6
        with:
          context: laravel
          file: laravel/Dockerfile.${{ matrix.imagem }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-app
            BASE_TAG=${{ env.PHP_MINOR }}-${{ env.REVISION }}
          cache-from: type=gha,scope=laravel-${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=laravel-${{ matrix.imagem }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-${{ matrix.imagem }}:${{ env.PHP_MINOR }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-${{ matrix.imagem }}:${{ env.PHP_MINOR }}-${{ env.REVISION }}

  monitoring:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Prometheus 3.13 LTS; Alertmanager + blackbox na mesma matriz (teste compartilhado).
          - { dir: prometheus, image: prometheus, major: "3", full: "3.13.1" }
          - { dir: grafana, image: grafana, major: "13", full: "13.1.1" }
          - { dir: alertmanager, image: alertmanager, major: "0", full: "0.30.0" }
          - { dir: blackbox, image: blackbox-exporter, major: "0", full: "0.28.0" }
    steps:
      - uses: actions/checkout@v4

      # promtool + dashboards antes do push.
      - name: Config, alertas e dashboards
        run: bash monitoring/test/prometheus-config.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: monitoring/${{ matrix.dir }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ matrix.major }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ matrix.full }}
