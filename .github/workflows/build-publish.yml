name: Build e publica imagens

# Publica as imagens de infraestrutura da organização no GHCR, sob o
# namespace da org (minúsculo, exigência de nome de imagem Docker):
#   ghcr.io/brasildatahub/postgres:17     (imagem única; tuning via envs PG_*)
#   ghcr.io/brasildatahub/pgbackrest:17   (sidecar de backup físico + PITR)
#   ghcr.io/brasildatahub/redis:7
#   ghcr.io/brasildatahub/meilisearch:1.34
#   ghcr.io/brasildatahub/prometheus:3    (config e regras de alerta embutidas)
#   ghcr.io/brasildatahub/grafana:13      (provisioning e dashboards embutidos)
#   ghcr.io/brasildatahub/alertmanager:0  (roteamento, inibição e janela de ETL)
#   ghcr.io/brasildatahub/blackbox-exporter:0 (módulos das classes de SLO)
#   ghcr.io/brasildatahub/pgbouncer:1     (transaction pooling; par do work_mem)
#   ghcr.io/brasildatahub/opensearch:3    (analisadores BR + exporter de métricas)
# Imagens genéricas — consumidas por qualquer projeto da org (baseempresarial,
# baseescolar, basehospitalar, ...). Nada aqui é específico de um projeto.
#
# E as imagens base das APLICAÇÕES, que seguem a mesma regra de genericidade:
#   ghcr.io/brasildatahub/laravel-app:8.4     (FrankenPHP + Octane)
#   ghcr.io/brasildatahub/laravel-worker:8.4  (PHP CLI: fila, Horizon, scheduler)
#   ghcr.io/brasildatahub/laravel-builder:8.4 (Composer + Node/npm, só build)

on:
  push:
    branches: [main]
    paths:
      # Filtros estreitos, por ARQUIVO QUE ENTRA NA IMAGEM. Antes eram
      # `postgres/**` e afins, o que republicava as três imagens a cada commit
      # de documentação — e agora também a cada mudança nos overlays de
      # métricas, que não entram em imagem nenhuma.
      - "postgres/Dockerfile"
      - "postgres/*.sh"
      - "postgres/backup/Dockerfile"
      - "postgres/backup/*.sh"
      # O job `pgbackrest` roda este teste ANTES do push, mas o teste não estava
      # no filtro: mudá-lo não disparava o build, e a correção ficava sem
      # verificação. Foi assim que a imagem passou de julho/2026 sem publicar.
      - "postgres/backup/test/**"
      - "postgres/initdb/**"
      - "postgres/.dockerignore"
      - "postgres/test/**"
      - "redis/Dockerfile"
      - "redis/redis.conf"
      - "pgbouncer/Dockerfile"
      - "pgbouncer/*.sh"
      - "pgbouncer/test/**"
      - "opensearch/Dockerfile"
      - "opensearch/index/**"
      - "opensearch/test/**"
      - "meilisearch/Dockerfile"
      - "monitoring/prometheus/**"
      - "monitoring/grafana/**"
      - "monitoring/alertmanager/**"
      - "monitoring/blackbox/**"
      - "monitoring/test/**"
      # Imagens base de aplicação. Note o que NÃO está aqui: `laravel/README.md`
      # e `laravel/docs/**`. Um build multi-arch destas imagens compila as 14
      # extensões duas vezes, uma delas sob emulação — republicar isso a cada
      # commit de documentação seria caro sem mudar um byte da imagem.
      - "laravel/Dockerfile.*"
      - "laravel/php-extensions.txt"
      - "laravel/php/**"
      - "laravel/caddy/**"
      - "laravel/entrypoint*.sh"
      - "laravel/.dockerignore"
      - "laravel/test/**"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch:
    inputs:
      servico:
        description: "Qual imagem republicar (todos = o repositório inteiro)"
        type: choice
        default: todos
        options:
          - todos
          - postgres
          - pgbackrest
          - redis
          - pgbouncer
          - opensearch
          - meilisearch
          - monitoring
          - laravel

env:
  REGISTRY: ghcr.io
  NAMESPACE: brasildatahub

jobs:
  # Quais imagens este push realmente afeta.
  #
  # POR QUE ESTE JOB EXISTE: os `paths:` lá em cima são do WORKFLOW, não dos
  # jobs. Eles decidem se o workflow roda — e, uma vez que roda, TODOS os jobs
  # rodam junto. Na prática isso significava que mudar duas linhas do
  # `redis/Dockerfile` reconstruía também as imagens de aplicação, cujo build
  # multi-arch compila 14 extensões PHP sob emulação e leva dezenas de minutos.
  #
  # Aqui o diff do push é lido uma vez e vira um output por imagem; cada job de
  # build ganha um `if:` sobre ele. Os `paths:` do topo continuam valendo como
  # primeira peneira — um commit só de documentação não chega nem a este job.
  #
  # Mudar ESTE ARQUIVO não republica nada por si só, e é deliberado: era esse o
  # caminho pelo qual um ajuste de comentário no workflow reconstruía a stack
  # inteira. Para republicar à mão, use `workflow_dispatch` — ele aceita
  # escolher uma imagem ou `todos`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      postgres: ${{ steps.filtro.outputs.postgres }}
      pgbackrest: ${{ steps.filtro.outputs.pgbackrest }}
      redis: ${{ steps.filtro.outputs.redis }}
      pgbouncer: ${{ steps.filtro.outputs.pgbouncer }}
      opensearch: ${{ steps.filtro.outputs.opensearch }}
      meilisearch: ${{ steps.filtro.outputs.meilisearch }}
      monitoring: ${{ steps.filtro.outputs.monitoring }}
      laravel: ${{ steps.filtro.outputs.laravel }}
    steps:
      # fetch-depth: 0 porque o `git diff` abaixo precisa do commit anterior ao
      # push, que um checkout raso não traz.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filtro
        env:
          # Via env, e não interpolado direto no `run`: é a forma segura de
          # levar contexto do evento para dentro do shell.
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          AGORA: ${{ github.sha }}
          ESCOLHA: ${{ inputs.servico }}
        run: |
          set -euo pipefail

          # Os mesmos recortes dos `paths:` do topo, agora por imagem. Cada
          # padrão casa só ARQUIVO QUE ENTRA NA IMAGEM — README e docs de fora.
          # Note `[^/]+\.sh$` no postgres: sem isso ele casaria também
          # `postgres/backup/*.sh`, que é a imagem do pgbackrest, não a dele.
          escopos() {
            cat <<'MAPA'
          postgres|^postgres/(Dockerfile$|[^/]+\.sh$|\.dockerignore$|initdb/|test/)
          pgbackrest|^postgres/backup/(Dockerfile$|[^/]+\.sh$|test/)
          redis|^redis/(Dockerfile|redis\.conf)$
          pgbouncer|^pgbouncer/(Dockerfile$|[^/]+\.sh$|test/)
          opensearch|^opensearch/(Dockerfile$|index/|test/)
          meilisearch|^meilisearch/Dockerfile$
          monitoring|^monitoring/(prometheus/|grafana/|alertmanager/|blackbox/|test/)
          laravel|^laravel/(Dockerfile\.|php-extensions\.txt$|php/|caddy/|entrypoint[^/]*\.sh$|\.dockerignore$|test/)
          MAPA
          }

          publica_tudo() {
            local motivo="$1"
            echo "::notice::$motivo — todas as imagens entram no build."
            while IFS='|' read -r nome _; do
              # `if`, e não `[ ... ] && ...`: sob `set -e`, um `&&` que resulta
              # falso no ÚLTIMO comando do corpo do laço encerraria o script.
              if [ -n "$nome" ]; then
                echo "${nome}=true" >> "$GITHUB_OUTPUT"
              fi
            done < <(escopos)
          }

          if [ "$EVENTO" = "workflow_dispatch" ]; then
              if [ "${ESCOLHA:-todos}" = "todos" ]; then
                  publica_tudo "Execução manual sem filtro"
              else
                  echo "::notice::Execução manual: só ${ESCOLHA}."
                  while IFS='|' read -r nome _; do
                      if [ "$nome" = "$ESCOLHA" ]; then
                          echo "${nome}=true"  >> "$GITHUB_OUTPUT"
                      elif [ -n "$nome" ]; then
                          echo "${nome}=false" >> "$GITHUB_OUTPUT"
                      fi
                  done < <(escopos)
              fi
              exit 0
          fi

          # Fail-safe: sem um ponto de partida válido não dá para saber o que
          # mudou, e deixar de publicar em silêncio é pior do que publicar
          # demais. Acontece em push forçado e no primeiro push de uma branch.
          if [ -z "${ANTES:-}" ] || ! git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
              publica_tudo "Sem commit anterior utilizável ($ANTES)"
              exit 0
          fi

          ARQUIVOS="$(git diff --name-only "$ANTES" "$AGORA")"
          echo "Arquivos no push:"
          echo "$ARQUIVOS" | sed 's/^/  /'

          while IFS='|' read -r nome padrao; do
              [ -n "$nome" ] || continue
              if printf '%s\n' "$ARQUIVOS" | grep -qE "$padrao"; then
                  echo "${nome}=true" >> "$GITHUB_OUTPUT"
                  echo "::notice::${nome}: será publicada."
              else
                  echo "${nome}=false" >> "$GITHUB_OUTPUT"
              fi
          done < <(escopos)

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Roda ANTES do push: o shm-guard decide o paralelismo efetivo da
      # instância, então uma regressão silenciosa aqui volta a expor o erro
      # "could not resize shared memory segment" (ver docs/troubleshooting.md).
      - name: Testes do shm-guard
        run: bash postgres/test/shm-guard.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: postgres
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/postgres:17
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/postgres:17.10

  # Sidecar de backup. Job SEPARADO do postgres e rodando o teste de integração
  # antes do push: o teste sobe banco + sidecar de verdade e percorre
  # archive_command → stanza → full → diff → restore → contagem. É o único
  # ponto do repositório onde "o backup existe" deixa de ser uma afirmação e
  # passa a ser uma verificação.
  pgbackrest:
    needs: changes
    if: needs.changes.outputs.pgbackrest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Ciclo completo de backup e restore
        run: bash postgres/backup/test/backup.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: postgres/backup
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbackrest:17
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbackrest:17.10

  redis:
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: redis
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/redis:7
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/redis:7.4

  # O PgBouncer é o par indivisível do work_mem de 96 MB (item 18): 100 × 96 MB
  # não cabe num limite de 14 GiB, 20 × 96 MB cabe. O teste roda antes do push
  # porque transaction pooling funciona perfeitamente até a aplicação usar um
  # SET de sessão ou um prepared statement — e aí quebra de formas que não
  # mencionam o PgBouncer no erro.
  pgbouncer:
    needs: changes
    if: needs.changes.outputs.pgbouncer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Pooling, SET LOCAL e prepared statements
        run: bash pgbouncer/test/pgbouncer.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: pgbouncer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbouncer:1
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/pgbouncer:1.24.1

  meilisearch:
    needs: changes
    if: needs.changes.outputs.meilisearch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: meilisearch
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/meilisearch:1.34

  # Três decisões do mapping são IMUTÁVEIS SEM REINDEXAR os 72,32 milhões de
  # documentos: number_of_shards, _source: false e auto_expand_replicas. O teste
  # sobe um nó de verdade e as afirma antes de a imagem ser publicada — custa
  # segundos; descobrir o mesmo erro depois custa a reindexação inteira.
  opensearch:
    needs: changes
    if: needs.changes.outputs.opensearch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Mapping, analisadores e contratos imutáveis
        run: |
          sudo sysctl -w vm.max_map_count=262144
          bash opensearch/test/opensearch.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: opensearch
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/opensearch:3
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/opensearch:3.3.0

  # Imagens base das aplicações Laravel da org. Job ÚNICO e SEQUENCIAL, não uma
  # matriz: o `laravel-builder` faz `FROM laravel-app`, então precisa dela já
  # publicada. Numa matriz os três rodariam em paralelo e o builder pegaria a
  # imagem da publicação ANTERIOR — passaria verde entregando a base errada.
  #
  # Multi-arch aqui, e não nos módulos de infraestrutura, porque estas imagens
  # são consumidas em tempo de BUILD, inclusive nas estações Apple Silicon da
  # equipe. Sem `arm64` no manifest, todo build local cairia em emulação.
  laravel:
    needs: changes
    if: needs.changes.outputs.laravel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # As duas metades da tag. `PHP_MINOR` identifica a stack; `REVISION` é o
      # contador da imagem, incrementado quando muda extensão, ini, Caddyfile,
      # entrypoint ou versão da base — ver laravel/docs/versionamento.md.
      PHP_MINOR: "8.4"
      # r2: Caddyfile ganhou `num_threads`/`max_threads` e o entrypoint passou a
      # dimensionar workers e threads do FrankenPHP pela CPU e memória do
      # container. Sem isso a aplicação atendia uma requisição por vez — ver
      # laravel/README.md, "Os três FRANKENPHP_*, e por que existem".
      REVISION: "r2"
    steps:
      - uses: actions/checkout@v4

      # Roda ANTES de qualquer push, e é o único ponto onde a paridade entre o
      # runtime web (Debian/glibc) e o worker (Alpine/musl) deixa de ser uma
      # esperança e vira uma verificação. Uma extensão presente num e ausente no
      # outro não quebra build nenhum: quebra um job de fila em produção, com
      # "Class not found", enquanto o container web funciona ao lado.
      - name: Paridade de extensões, diretivas de PHP e toolchain
        run: bash laravel/test/laravel-images.test.sh

      # QEMU só é necessário a partir daqui: o teste acima builda na arquitetura
      # nativa do runner, que é o que se quer — verificar rápido antes de gastar
      # os minutos da emulação.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: laravel-app
        uses: docker/build-push-action@v6
        with:
          context: laravel
          file: laravel/Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=laravel-app
          cache-to: type=gha,mode=max,scope=laravel-app
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-app:${{ env.PHP_MINOR }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-app:${{ env.PHP_MINOR }}-${{ env.REVISION }}

      - name: laravel-worker
        uses: docker/build-push-action@v6
        with:
          context: laravel
          file: laravel/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=laravel-worker
          cache-to: type=gha,mode=max,scope=laravel-worker
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-worker:${{ env.PHP_MINOR }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-worker:${{ env.PHP_MINOR }}-${{ env.REVISION }}

      # Aponta para a tag IMUTÁVEL recém-publicada, não para a móvel: é o que
      # garante que o builder desta execução derive da app desta execução.
      - name: laravel-builder
        uses: docker/build-push-action@v6
        with:
          context: laravel
          file: laravel/Dockerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-app
            BASE_TAG=${{ env.PHP_MINOR }}-${{ env.REVISION }}
          cache-from: type=gha,scope=laravel-builder
          cache-to: type=gha,mode=max,scope=laravel-builder
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-builder:${{ env.PHP_MINOR }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/laravel-builder:${{ env.PHP_MINOR }}-${{ env.REVISION }}

  monitoring:
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # 3.13 é a LTS atual do Prometheus (suporte até 2027-07-31); a 3.5,
          # LTS anterior, sai de suporte em 2026-07-31.
          - { dir: prometheus, image: prometheus, major: "3", full: "3.13.1" }
          - { dir: grafana, image: grafana, major: "13", full: "13.1.1" }
          # O Alertmanager é o que faz as 18 regras chegarem a alguém; o
          # blackbox é o que substitui os cards de latência do Laravel Pulse.
          # Os dois entram na mesma matriz porque compartilham o teste acima.
          - { dir: alertmanager, image: alertmanager, major: "0", full: "0.30.0" }
          - { dir: blackbox, image: blackbox-exporter, major: "0", full: "0.28.0" }
    steps:
      - uses: actions/checkout@v4

      # Roda ANTES do push, no mesmo espírito dos testes do shm-guard: uma
      # config ou regra inválida só se manifestaria como container em restart
      # loop no servidor, e um dashboard com o datasource errado abre VAZIO,
      # sem erro nenhum — ninguém percebe até precisar dele.
      - name: Config, alertas e dashboards
        run: bash monitoring/test/prometheus-config.test.sh

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: monitoring/${{ matrix.dir }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ matrix.major }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ matrix.full }}
