[Date]
date.timezone="UTC"
display_errors=Off
log_errors=On
expose_php=Off

error_log = "/dev/stderr"

memory_limit = 256M
upload_max_filesize = 5G
post_max_size = 5G
; max_execution_time=0 is required for Octane long-running workers.
; Each request is bounded by Octane's --max-requests and Caddy timeouts, not by this value.
max_execution_time = 0
default_socket_timeout = 3600
variables_order = "EGPCS"

[opcache]
; Medido no container: o buffer de strings internas estava 99% cheio (7,92 MB
; usados de 8 MB). Cheio, o PHP para de internar strings e passa a duplicá-las
; a cada requisição. Os demais limites tinham folga — 1.562 scripts em cache
; para 16.229 chaves e 39 MB de 128 MB, sem nenhum restart por falta de espaço —
; então só a memória geral ganha margem, sem inflar o que já sobrava.
opcache.interned_strings_buffer = 32
opcache.memory_consumption = 192

; Sem isto o OPcache não vale nada nos containers worker/scheduler: o Horizon
; roda em CLI, onde o padrão é desligado, e reinterpretava o código a cada
; processo.
opcache.enable_cli = 1

; JIT desligado: a aplicação é limitada por I/O, não por CPU.
; Usar `disable` (não `tracing` com buffer zero) — com tracing o php -i
; aparenta JIT ligado. Remedir sem rebuild: OPCACHE_JIT_BUFFER_SIZE (o
; entrypoint sobrescreve modo e buffer).
opcache.jit = disable
