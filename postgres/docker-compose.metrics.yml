# Overlay OPCIONAL de métricas — acrescenta o postgres_exporter.
# Usar JUNTO do compose base (não sozinho; `--remove-orphans` removeria o exporter):
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
#
# O serviço `postgres` NÃO é tocado: a senha do exporter fica em `.env.metrics`
# (não no `.env`), porque qualquer variável nova no `.env` recria o container
# do banco. Role `metrics_read` precisa existir antes (initdb/03-role-metrics.sh).
#
#   DATA_SOURCE_PASS=...          # em .env.metrics
#   # PG_METRICS_USER=metrics_read
#   # PG_EXPORTER_MEMORY_LIMIT=128M

services:
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      # required: false: compose válido antes do arquivo existir (falha = auth no log).
      - path: .env.metrics
        required: false
    environment:
      # Forma decomposta: evita URL com senha em `docker inspect` / logs.
      # DATA_SOURCE_PASS vem só do .env.metrics (`environment:` teria precedência).
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${PG_METRICS_USER:-metrics_read}
    # Label própria — `bdh` filtra por org.brasildatahub.service=postgres.
    labels:
      org.brasildatahub.service: postgres-exporter
    command:
      # Desligados: sem réplica; coletores de tabela geram cardinalidade alta em schemas particionados.
      - --no-collector.replication
      - --no-collector.replication_slots
      - --no-collector.stat_replication
      - --no-collector.stat_user_tables
      - --no-collector.statio_user_tables
      # Ligados: checkpoint (PG17), xmin longo, wraparound, autovacuum, uptime.
      - --collector.stat_checkpointer
      - --collector.long_running_transactions
      - --collector.database_wraparound
      - --collector.stat_activity_autovacuum
      - --collector.postmaster
      # 8s < scrape_timeout 10s: coleta parcial em vez de scrape perdido.
      - --collection-timeout=8s
    # stat_statements desligado: queryid vira label e explode cardinalidade.
    # Sem `ports:`: /metrics sem auth; scrape só via rede bdh_metrics.
    networks:
      - default
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${PG_EXPORTER_MEMORY_LIMIT:-128M}
          cpus: "${PG_EXPORTER_CPU_LIMIT:-0.5}"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # Sem `external: true`: com external, `network prune` quebraria o `up` do banco.
  # Reuso por nome entre projetos; aviso cosmético do Compose é esperado.
  bdh_metrics:
    name: ${METRICS_NETWORK:-bdh_metrics}
