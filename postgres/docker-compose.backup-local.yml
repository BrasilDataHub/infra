# Overlay de REPOSITÓRIO LOCAL (posix) — bind do host nos dois containers.
# Sempre DEPOIS de docker-compose.backup.yml:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.backup.yml \
#                  -f docker-compose.backup-local.yml up -d
#
# Com repo1-type=posix o path precisa estar montado no sidecar E no Postgres
# (archive-push roda no postmaster). Sem mount no banco: backup "ok", WAL
# falha, pg_wal cresce até encher o disco.
#
# Preferir posix: restauração rápida no mesmo DC, sem proteção contra perda do host.
# Preferir s3 (só backup.yml): sobrevive ao host; mais lento. repo1+repo2 coexistentes.
#
#   BDH_BACKUP_REPO_DIR=/mnt/bdh-backup/pgbackrest
#   install -d -o 999 -g 999 -m 0750 "$BDH_BACKUP_REPO_DIR"
#   # pgbackrest.conf: repo1-path=/var/lib/pgbackrest (path DENTRO do container)
#   # Modelo: backup/pgbackrest.conf.local.example

services:
  postgres:
    volumes:
      - type: bind
        source: "${BDH_BACKUP_REPO_DIR:?defina BDH_BACKUP_REPO_DIR, ex. /mnt/bdh-backup/pgbackrest}"
        target: /var/lib/pgbackrest
        bind:
          # create_host_path: false — volume desmontado não deve virar dir vazio no disco raiz.
          create_host_path: false

  pgbackrest:
    volumes:
      - type: bind
        source: "${BDH_BACKUP_REPO_DIR:?defina BDH_BACKUP_REPO_DIR, ex. /mnt/bdh-backup/pgbackrest}"
        target: /var/lib/pgbackrest
        bind:
          create_host_path: false
