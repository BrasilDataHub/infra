# Perfil DEDICADA-32gb — máquina exclusiva do Postgres (32 GB RAM, 8 vCPUs,
# SSD/NVMe local). PGDATA em BIND no disco local (/data/pgdata) — nunca
# volume de rede. Porta exposta somente à rede privada (vSwitch/firewall).
# Parâmetros do perfil: env.dedicada-32gb | Guia completo: docs/perfis.md

services:
  postgres:
    image: ghcr.io/brasildatahub/postgres:17
    restart: unless-stopped
    env_file:
      - env.dedicada-32gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      DADOS_READ_PASSWORD: ${DADOS_READ_PASSWORD:-}
    volumes:
      - /data/pgdata:/var/lib/postgresql/data
    ports:
      # Exclusivamente o IP privado — nunca 0.0.0.0.
      - "${PRIVATE_IP:?defina PRIVATE_IP}:5432:5432"
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 28G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
