# =============================================================================
# Perfil DEDICADA-128 — AX102 (Ryzen 9 7950X3D, 128 GB DDR5, 2×1,92 TB NVMe).
# Instância dedicada ao PostgreSQL (decisão de máquina: tarefa F5).
# PGDATA em bind no NVMe local (/data/pgdata) — nunca em volume de rede.
# =============================================================================

# --- Conexões ---------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200

# --- Memória ----------------------------------------------------------------
shared_buffers = 32GB
effective_cache_size = 96GB
work_mem = 64MB
maintenance_work_mem = 2GB

# --- Planner / IO -----------------------------------------------------------
random_page_cost = 1.1              # NVMe local
effective_io_concurrency = 200
default_statistics_target = 200

# --- Paralelismo ------------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- WAL / Checkpoints ------------------------------------------------------
max_wal_size = 16GB
min_wal_size = 2GB
wal_compression = zstd
checkpoint_completion_target = 0.9

# --- Autovacuum -------------------------------------------------------------
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Timeouts de servidor ---------------------------------------------------
idle_in_transaction_session_timeout = 60s

# --- Diagnóstico ------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Backup físico / PITR (habilitar junto com o pgbackrest — ver backup/) ---
# archive_mode = on
# archive_command = 'pgbackrest --stanza=dados-cnpj archive-push %p'

# --- Locale / misc (espelha os defaults da imagem oficial) -------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
dynamic_shared_memory_type = posix
