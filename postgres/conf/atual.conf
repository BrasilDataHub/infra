# =============================================================================
# Perfil ATUAL — CCX13 compartilhado (8 GB de RAM divididos com app/Redis/Meili;
# ~4 GB destinados ao Postgres). Substitui a configuração manual no Dokploy.
# Banco: dados_cnpj, 116 GB, leitura intensiva (busca) + carga mensal do ETL.
# =============================================================================

# --- Conexões ---------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Memória ----------------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 4GB
work_mem = 32MB
maintenance_work_mem = 512MB

# --- Planner / IO -----------------------------------------------------------
random_page_cost = 1.5              # volume de rede Hetzner (não é NVMe local)
effective_io_concurrency = 100
jit = off                           # 2 vCPU: JIT custa mais do que rende

# --- WAL / Checkpoints ------------------------------------------------------
max_wal_size = 4GB
min_wal_size = 512MB
wal_compression = zstd
checkpoint_completion_target = 0.9

# --- Timeouts de servidor ---------------------------------------------------
idle_in_transaction_session_timeout = 60s

# --- Diagnóstico ------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 2000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Locale / misc (espelha os defaults da imagem oficial) -------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
dynamic_shared_memory_type = posix
