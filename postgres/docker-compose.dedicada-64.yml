# Cenário 2 — dedicada 64 GB (ex.: CCX43, 16 vCPU, 360 GB NVMe local).
# PGDATA em BIND no NVMe local (/data/pgdata) — nunca volume de rede.
# Porta exposta somente à rede privada (vSwitch/firewall — tarefa F7).

services:
  postgres:
    image: ghcr.io/brasildatahub/postgres:17
    restart: unless-stopped
    env_file:
      - env.dedicada-64
    environment:
      POSTGRES_DB: dados_cnpj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      DADOS_READ_PASSWORD: ${DADOS_READ_PASSWORD:-}
    volumes:
      - /data/pgdata:/var/lib/postgresql/data
    ports:
      # Exclusivamente o IP privado da vSwitch — nunca 0.0.0.0 (a porta
      # 15432 pública da instância antiga é um dos defeitos a corrigir).
      - "${PRIVATE_IP:?defina PRIVATE_IP}:5432:5432"
    shm_size: 4gb
    deploy:
      resources:
        limits:
          memory: 56G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dados_cnpj"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
