# Perfil DEDICADA-128 — AX102 (Ryzen 9 7950X3D, 128 GB DDR5, 2×1,92 TB NVMe).
# PGDATA em BIND no NVMe local (/data/pgdata) — nunca volume de rede.
# Porta exposta somente à rede privada (vSwitch/firewall — tarefa F7).

services:
  postgres:
    image: ghcr.io/OWNER/baseempresarial-postgres:17-dedicada-128
    restart: unless-stopped
    environment:
      POSTGRES_DB: dados_cnpj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      DADOS_READ_PASSWORD: ${DADOS_READ_PASSWORD:-}
    volumes:
      - /data/pgdata:/var/lib/postgresql/data
    ports:
      # Exclusivamente o IP privado da vSwitch — nunca 0.0.0.0 (a porta
      # 15432 pública da instância antiga é um dos defeitos a corrigir).
      - "${PRIVATE_IP:?defina PRIVATE_IP}:5432:5432"
    shm_size: 4gb
    deploy:
      resources:
        limits:
          memory: 112G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dados_cnpj"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
