# Validação LOCAL (volume descartável). Os cenários dedicados usam
# shared_buffers de 16/32 GB — inviáveis numa máquina de desenvolvimento —,
# então valide-os sobrescrevendo só a memória e conferindo o restante em
# pg_settings.
#
#   docker compose -f docker-compose.local.yml up --build -d          # defaults
#   PG_SHARED_BUFFERS=512MB PG_RANDOM_PAGE_COST=1.1 PG_MAX_PARALLEL_WORKERS=12 \
#       docker compose -f docker-compose.local.yml up --build -d     # "dedicada" em miniatura
#
# Verificação:
#   docker compose -f docker-compose.local.yml exec postgres \
#       psql -U postgres -d dados_cnpj -c "SHOW shared_buffers; SHOW random_page_cost;"

services:
  postgres:
    build: .
    environment:
      POSTGRES_DB: dados_cnpj
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-test
      DADOS_READ_PASSWORD: local-test
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-}
      PG_WORK_MEM: ${PG_WORK_MEM:-}
      PG_RANDOM_PAGE_COST: ${PG_RANDOM_PAGE_COST:-}
      PG_MAX_PARALLEL_WORKERS: ${PG_MAX_PARALLEL_WORKERS:-}
      PG_MAX_PARALLEL_WORKERS_PER_GATHER: ${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-}
      PG_AUTOVACUUM_VACUUM_SCALE_FACTOR: ${PG_AUTOVACUUM_VACUUM_SCALE_FACTOR:-}
      PG_DEFAULT_STATISTICS_TARGET: ${PG_DEFAULT_STATISTICS_TARGET:-}
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dados_cnpj"]
      interval: 5s
      timeout: 5s
      retries: 10
