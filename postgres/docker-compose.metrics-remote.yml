# Publica a porta do postgres_exporter para Prometheus remoto.
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.metrics.yml \
#                  -f docker-compose.metrics-remote.yml up -d
#
# Travas em monitoring/docker-compose.remote.yml. Só acrescenta ports ao exporter.

services:
  postgres-exporter:
    ports:
      - "${METRICS_BIND_IP:?defina METRICS_BIND_IP — nunca 0.0.0.0}:${PG_EXPORTER_PORT:-9187}:9187"
