# Compose de PRODUÇÃO do PostgreSQL — a forma recomendada de implantar esta
# imagem (por quê: docs/estrategia-deploy.md).
#
# Um perfil tem três partes e só uma é env: bloco PG_*, /dev/shm e limite de
# memória. Os três valores vêm de docs/perfis.md; cole o bloco PG_* do perfil
# num .env ao lado deste arquivo, junto com as variáveis abaixo.
#
#   POSTGRES_DB=dados_cnpj
#   POSTGRES_PASSWORD=...
#   DADOS_READ_PASSWORD=...
#   PG_SHM_BYTES=2147483648      # perfil dedicada-16gb
#   PG_MEMORY_LIMIT=14G          # perfil dedicada-16gb
#   # opcionais:
#   # BIND_IP=10.0.0.5           # restringe a publicação a uma interface
#   # POSTGRES_PORT=5432
#   # PG_VOLUME=bdh_pg_data
#
#   docker compose up -d && docker compose logs -f postgres
#
# Depois: rodar a verificação pós-deploy (docs/deploy.md) — são 4 comandos, e
# são o que separa um perfil aplicado de um perfil aplicado pela metade.
#
# Este mesmo YAML serve para um recurso Compose stack de Dokploy/Coolify.
# Prepare o host antes: docs/host.md.

services:
  postgres:
    image: ghcr.io/brasildatahub/postgres:17
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      DADOS_READ_PASSWORD: ${DADOS_READ_PASSWORD:-}
    # consumida pelo `bdh status` e pela mensagem de login (ver setup.sh)
    labels:
      org.brasildatahub.service: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      # /dev/shm do perfil. Mount tmpfs, e não shm_size: esta forma funciona
      # tanto em `docker compose up` quanto em Swarm/painel — shm_size é
      # descartado sem aviso em Swarm e /dev/shm cai para os 64 MB de default
      # do Docker, quebrando queries paralelas pesadas (docs/deploy.md).
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: ${PG_SHM_BYTES:-1073741824}   # bytes; default = dedicada-8gb
    ports:
      # 0.0.0.0 por default: o banco fica alcançável de qualquer origem, e a
      # senha é a única barreira. Para restringir, defina BIND_IP (interface
      # privada) e/ou limite a origem no firewall — ver docs/host.md, Rede.
      - "${BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    logging:
      # Sem isto, o log de um container cresce sem teto no /var/lib/docker do
      # host — que é o MESMO NVMe do PGDATA. "Log enche o disco e derruba o
      # banco" é um modo de falha real, e 05 §9.3-I é explícito: não alerte
      # sobre log, corrija. 50m × 3 = 150 MB por container, no pior caso.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-7G}      # default = dedicada-8gb
          cpus: "${PG_CPU_LIMIT:-0}"
    healthcheck:
      # SELECT em vez de `pg_isready`: o pg_isready responde "accepting
      # connections" mesmo quando o database do projeto não existe — o que
      # acontece se um initdb for interrompido (volume inicializado pela
      # metade). A query só passa com o database realmente utilizável.
      test: ["CMD-SHELL", "psql -U postgres -d $${POSTGRES_DB} -c 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  # Volume nomeado com driver local — o padrão do repositório (justificativa no
  # README da raiz). `name` fixo para que backup, `docker volume inspect` e o
  # `bdh` não dependam do nome do projeto Compose.
  pg_data:
    driver: local
    name: ${PG_VOLUME:-bdh_pg_data}
