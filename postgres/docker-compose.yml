# Compose de PRODUÇÃO do PostgreSQL (docs/deploy.md, docs/perfis.md).
# Perfil = bloco PG_* no .env + PG_SHM_BYTES + PG_MEMORY_LIMIT.
#
#   POSTGRES_DB=dados_cnpj
#   POSTGRES_PASSWORD=...
#   DADOS_READ_PASSWORD=...
#   PG_SHM_BYTES=2147483648
#   PG_MEMORY_LIMIT=14G
#   # BIND_IP=10.0.0.5
#
#   docker compose up -d && docker compose logs -f postgres

services:
  postgres:
    image: ghcr.io/brasildatahub/postgres:17
    restart: unless-stopped
    # O default do Compose é 10 s. Um shutdown "fast" (SIGINT) de um banco com
    # shared_buffers na casa das dezenas de GB pode passar disso escrevendo o
    # checkpoint final — e aí o Docker manda SIGKILL, o que custa crash
    # recovery na subida seguinte. Medido em 141 GB: com `CHECKPOINT` manual
    # antes, o shutdown sai em segundos; sem ele, o teto precisa ser generoso.
    stop_grace_period: 300s
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      DADOS_READ_PASSWORD: ${DADOS_READ_PASSWORD:-}
    # consumida pelo `bdh status` e pela mensagem de login (ver setup.sh)
    labels:
      org.brasildatahub.service: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      # tmpfs (não shm_size): shm_size é ignorado em Swarm → 64 MB default.
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: ${PG_SHM_BYTES:-1073741824}   # bytes; default = dedicada-8gb
    ports:
      # 0.0.0.0 por default: o banco fica alcançável de qualquer origem, e a
      # senha é a única barreira. Para restringir, defina BIND_IP (interface
      # privada) e/ou limite a origem no firewall — ver docs/host.md, Rede.
      - "${BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    logging:
      # Teto de log no disco do host (mesmo NVMe do PGDATA).
      # 50m × 3 = 150 MB por container no pior caso.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-7G}      # default = dedicada-8gb
          cpus: "${PG_CPU_LIMIT:-0}"
    healthcheck:
      # SELECT em vez de `pg_isready`: o pg_isready responde "accepting
      # connections" mesmo quando o database do projeto não existe — o que
      # acontece se um initdb for interrompido (volume inicializado pela
      # metade). A query só passa com o database realmente utilizável.
      test: ["CMD-SHELL", "psql -U postgres -d $${POSTGRES_DB} -c 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  # Volume nomeado com driver local. `name` fixo para backup,
  # `docker volume inspect` e o `bdh` não dependerem do projeto Compose.
  pg_data:
    driver: local
    name: ${PG_VOLUME:-bdh_pg_data}
