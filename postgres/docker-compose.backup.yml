# Overlay de BACKUP FÍSICO — sidecar pgBackRest + arquivamento contínuo de WAL.
#
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d
#
# Diferente do overlay de métricas: este RECRIA o Postgres (`archive_mode` é
# parâmetro de postmaster). Planeje o restart; as três mudanças entram juntas.
#
# Ordem: (1) /etc/pgbackrest/pgbackrest.conf no host (chown 999:999, chmod 640);
# (2) alerta ArquivamentoDeWalParado notificando; (3) este `up -d`.
#
#   PGBACKREST_STANZA=dados-cnpj
#   # PGBACKREST_CONF_DIR=/etc/pgbackrest
#   # BDH_BACKUP_FULL_SCHEDULE=0 6 * * 0
#   # BDH_BACKUP_DIFF_SCHEDULE=0 6 * * 1-6
#   # PG_ARCHIVE_TIMEOUT=60s
#
# Credenciais S3 ficam só no pgbackrest.conf do host (montado RO).

services:
  postgres:
    environment:
      # Sem archive_mode: sidecar agendado e nenhum WAL no repositório.
      PG_ARCHIVE_MODE: ${PG_ARCHIVE_MODE:-on}
      PG_ARCHIVE_COMMAND: pgbackrest --stanza=${PGBACKREST_STANZA:?defina PGBACKREST_STANZA} archive-push %p
      PG_ARCHIVE_TIMEOUT: ${PG_ARCHIVE_TIMEOUT:-60s}
    volumes:
      # Socket compartilhado: pgBackRest local não fala TCP com o banco.
      - pg_socket:/var/run/postgresql
      # Mesmo conf nos dois lados — divergir arquiva num repo e restaura de outro.
      - type: bind
        source: ${PGBACKREST_CONF_DIR:-/etc/pgbackrest}
        target: /etc/pgbackrest
        read_only: true
        bind:
          create_host_path: false

  pgbackrest:
    image: ghcr.io/brasildatahub/pgbackrest:17
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PGBACKREST_STANZA: ${PGBACKREST_STANZA:?defina PGBACKREST_STANZA}
      BDH_BACKUP_FULL_SCHEDULE: ${BDH_BACKUP_FULL_SCHEDULE:-0 6 * * 0}
      BDH_BACKUP_DIFF_SCHEDULE: ${BDH_BACKUP_DIFF_SCHEDULE:-0 6 * * 1-6}
      BDH_BACKUP_CHECK_SCHEDULE: ${BDH_BACKUP_CHECK_SCHEDULE:-0 */6 * * *}
      BDH_BACKUP_TEXTFILE_DIR: /var/lib/node_exporter/textfile
    labels:
      org.brasildatahub.service: pgbackrest
    volumes:
      # RW: restore/stanza-upgrade escrevem; proteção real está em restore-test.sh.
      - pg_data:/var/lib/postgresql/data
      - pg_socket:/var/run/postgresql
      - type: bind
        source: ${PGBACKREST_CONF_DIR:-/etc/pgbackrest}
        target: /etc/pgbackrest
        read_only: true
        bind:
          create_host_path: false
      # Textfile do node_exporter (outro projeto Compose) — bind de dir do host.
      - type: bind
        source: ${NODE_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}
        target: /var/lib/node_exporter/textfile
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          # process-max=4 + zstd: 512M evita disputa de RAM com o banco.
          memory: ${PGBACKREST_MEMORY_LIMIT:-512M}
          cpus: "${PGBACKREST_CPU_LIMIT:-4}"
    healthcheck:
      # `info` (não `check`): `check` forçaria troca de WAL a cada intervalo.
      # `su postgres`: Docker healthcheck roda como root; pgBackRest recusa.
      test: ["CMD-SHELL", "su -s /bin/bash postgres -c \"pgbackrest --stanza=$${PGBACKREST_STANZA} info --output=json\" | jq -e '.[0].status.code == 0' > /dev/null"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Só o socket. Não redeclare `pg_data` com outro `name`.
  pg_socket:
    driver: local
    name: ${PG_SOCKET_VOLUME:-bdh_pg_socket}
