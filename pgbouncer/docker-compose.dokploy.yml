# PgBouncer para painel (Dokploy/Coolify) — arquivo único, sem overlays/.env.
# Cole no Compose do painel. Rede `external` (criada pelo painel); valores embutidos.
#
# Antes: (1) imagem com PGB_EXTRA_DATABASES/USERS
#   docker run --rm --entrypoint sh ghcr.io/brasildatahub/pgbouncer:1 \
#     -c 'grep -c PGB_EXTRA_DATABASES /usr/local/bin/generate-config.sh'
# (2) sem outro container com alias `pgbouncer` na mesma rede.
#
# App: DB_HOST/CDC_DB_HOST = alias `pgbouncer` (não o nome do serviço no painel).

services:
  pgbouncer:
    image: ghcr.io/brasildatahub/pgbouncer:1
    restart: unless-stopped

    environment:
      # IP privado do host do banco — não o público (senha em claro).
      PGB_DB_HOST: 10.0.1.10
      PGB_DB_PORT: "5432"

      # Par principal = admin_users/stats_users (SHOW POOLS / SHOW STATS).
      PGB_DB_NAME: baseempresarial
      PGB_USER: postgres
      PGB_PASSWORD: "<SENHA_DO_POSTGRES>"

      # Banco/usuário fora daqui → "no such database" / falha no handshake.
      PGB_EXTRA_DATABASES: "dados_cnpj"
      PGB_EXTRA_USERS: "dados_read=<SENHA_DO_DADOS_READ>"

      # default_pool_size por par (db, user); confira vs max_connections do PG.
      PGB_POOL_MODE: transaction
      PGB_DEFAULT_POOL_SIZE: "20"
      PGB_MAX_CLIENT_CONN: "400"

    networks:
      dokploy-network:
        aliases:
          # Nome em DB_HOST/CDC_DB_HOST — explícito para sobreviver a rename do serviço.
          - pgbouncer

    healthcheck:
      # Prova processo + auth do PGB_USER. `$$` = Compose não interpola.
      test: ["CMD-SHELL", "PGPASSWORD=$${PGB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U $${PGB_USER} -d pgbouncer -tAc 'SHOW LISTS' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Sem `ports:`: app alcança por DNS na rede. Diagnóstico via docker exec.

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1"

networks:
  dokploy-network:
    external: true
