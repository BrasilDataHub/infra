# Overlay para quando a rede da aplicação JÁ EXISTE e não é criada por este
# compose — o caso de quem implanta a aplicação com Dokploy, Coolify, Swarm ou
# qualquer painel que cria a própria rede.
#
#   docker compose -f docker-compose.yml -f docker-compose.rede-externa.yml up -d
#
# Ou, no host provisionado pelo `setup.sh`, instale-o como
# `docker-compose.override.yml`: o helper `bdh` inclui esse nome
# automaticamente, e assim `bdh up pgbouncer` não perde a rede.
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUE ELE EXISTE
#
# O compose base declara a rede da aplicação SEM `external: true`, para que uma
# instalação do zero funcione sem pré-requisito. Apontar `APP_NETWORK` para uma
# rede que já existe, nesse caso, falha:
#
#   network dokploy-network was found but has incorrect label
#   com.docker.compose.network set to "" (expected: "baseempresarial")
#
# A alternativa — `docker network connect` na mão — funciona e não sobrevive:
# o próximo `up -d` recria o container sem a rede, e a aplicação perde o pooler
# no meio de um deploy que parecia rotineiro.
# ─────────────────────────────────────────────────────────────────────────────
#
# .env ao lado:
#   APP_NETWORK=dokploy-network     # o nome exato da rede da aplicação

services:
  pgbouncer:
    networks:
      default:
        # O alias é o host que a aplicação usa em DB_HOST. Sem ele, só o nome
        # do container resolve — e esse nome carrega o prefixo do projeto
        # Compose, que muda de host para host.
        aliases:
          - pgbouncer
      baseempresarial:
        aliases:
          - pgbouncer

networks:
  baseempresarial:
    name: ${APP_NETWORK:?defina APP_NETWORK com o nome da rede da aplicação}
    external: true
