# Overlay para quando a rede da aplicação JÁ EXISTE e não é criada por este
# compose (Dokploy, Coolify, Swarm ou painel que cria a própria rede).
#
#   docker compose -f docker-compose.yml -f docker-compose.rede-externa.yml up -d
#
# No host do `setup.sh`, use como `docker-compose.override.yml` — o `bdh`
# inclui esse nome automaticamente.
#
# O compose base declara a rede sem `external: true` (instalação do zero).
# Rede pré-existente exige este overlay; `docker network connect` manual
# não sobrevive ao próximo `up -d`.
#
# .env ao lado:
#   APP_NETWORK=dokploy-network     # o nome exato da rede da aplicação

services:
  pgbouncer:
    networks:
      default:
        # Alias = DB_HOST da aplicação. Sem ele, só o nome do container resolve.
        aliases:
          - pgbouncer
      baseempresarial:
        aliases:
          - pgbouncer

networks:
  baseempresarial:
    name: ${APP_NETWORK:?defina APP_NETWORK com o nome da rede da aplicação}
    external: true
