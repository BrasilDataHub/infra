# Compose de PRODUÇÃO do PgBouncer — roda no bdh-apps, JUNTO da aplicação.
#
#   docker compose up -d
#
# No host da APLICAÇÃO, e não no do banco, e isso não é detalhe: o ganho do
# pooler é encurtar o caminho de abertura de conexão que o cliente percorre. Com
# ele do lado do banco, cada nova conexão do Octane ainda pagaria o RTT de rede
# antes de encontrar o pool.
#
# .env ao lado deste arquivo:
#   PGB_DB_HOST=<ip-do-bdh-data>
#   PGB_DB_NAME=dados_cnpj
#   PGB_USER=postgres
#   PGB_PASSWORD=...
#   # opcionais:
#   # PGB_DB_PORT=15432
#   # PGB_DEFAULT_POOL_SIZE=20     # multiplica work_mem no pior caso
#   # PGB_MAX_CLIENT_CONN=400      # conexões do lado cliente, ~2 KB cada
#   # PGB_PASSWORD_SCRAM='SCRAM-SHA-256$...'   # preferível à senha em texto
#
# ORDEM DE IMPLANTAÇÃO — o par do item 18 é indivisível:
#   1. subir o PgBouncer e apontar a aplicação para ele (porta 6432);
#   2. confirmar `SHOW POOLS` com tráfego real passando;
#   3. SÓ ENTÃO aplicar max_connections=60 + work_mem=96MB no Postgres
#      (perfil compartilhada-14gb) — exige restart do banco.
#
# Inverter a ordem derruba a aplicação: 60 conexões diretas não atendem o que
# hoje abre até 100.

services:
  pgbouncer:
    image: ghcr.io/brasildatahub/pgbouncer:1
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PGB_DB_HOST: ${PGB_DB_HOST:?defina PGB_DB_HOST}
      PGB_DB_PORT: ${PGB_DB_PORT:-5432}
      PGB_DB_NAME: ${PGB_DB_NAME:?defina PGB_DB_NAME}
      PGB_USER: ${PGB_USER:?defina PGB_USER}
      PGB_PASSWORD: ${PGB_PASSWORD:?defina PGB_PASSWORD}
      PGB_PASSWORD_SCRAM: ${PGB_PASSWORD_SCRAM:-}
      PGB_POOL_MODE: ${PGB_POOL_MODE:-transaction}
      PGB_DEFAULT_POOL_SIZE: ${PGB_DEFAULT_POOL_SIZE:-20}
      PGB_MAX_CLIENT_CONN: ${PGB_MAX_CLIENT_CONN:-400}
    labels:
      org.brasildatahub.service: pgbouncer
    ports:
      # 127.0.0.1 por default: o PgBouncer fica no MESMO host da aplicação, e
      # publicá-lo na interface externa daria a qualquer um um caminho até o
      # banco com a autenticação do pooler no meio.
      - "${PGBOUNCER_BIND_IP:-127.0.0.1}:${PGBOUNCER_PORT:-6432}:6432"
    networks:
      - default
      - baseempresarial
    logging:
      # Teto de log — a justificativa está em ../postgres/docker-compose.yml.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          # 128 MiB é o valor do orçamento de 03 §3.2. O PgBouncer é
          # single-threaded e guarda ~2 KB por conexão de cliente: 400 clientes
          # cabem em menos de 1 MiB de buffers.
          memory: ${PGBOUNCER_MEMORY_LIMIT:-128M}
          cpus: "${PGBOUNCER_CPU_LIMIT:-1}"
    healthcheck:
      # `SHOW LISTS` no database de administração: confirma que o processo está
      # aceitando conexão E que a configuração carregou. Um `nc -z` na porta
      # passaria com a config quebrada.
      test: ["CMD-SHELL", "PGPASSWORD=$${PGB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U $${PGB_USER} -d pgbouncer -tAc 'SHOW LISTS' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # A rede da aplicação, para que o Octane e o Horizon alcancem o pooler pelo
  # nome do serviço. Sem `external: true`, pela mesma razão da bdh_metrics.
  baseempresarial:
    name: ${APP_NETWORK:-baseempresarial}
