# Alertas do PostgreSQL — BrasilDataHub.
# Perfil: ETL massivo, base grande. rate() com janela ≥ 2m (scrape 30s).

groups:
  - name: postgres
    rules:
      - alert: PostgresConexoesPertoDoLimite
        # max_connections 100–300; estourar rejeita conexão.
        expr: |
          sum by (instance) (pg_stat_database_numbackends)
            / max by (instance) (pg_settings_max_connections) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conexões acima de 85% do max_connections"
          description: >-
            Antes de aumentar max_connections, verifique se a aplicação está
            usando pool — subir o teto multiplica o work_mem alocável e é a via
            rápida para OOM (postgres/docs/perfis.md).

      - alert: TransacaoLongaSegurandoXmin
        # Guarda `> 0`: sem transação, a série é 0 e time()-0 dispara sempre.
        expr: |
          pg_long_running_transactions > 0
          and
          time() - pg_long_running_transactions_oldest_timestamp_seconds > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Transação aberta há mais de 1 hora"
          description: >-
            Enquanto ela viver, o autovacuum não consegue limpar tuplas mortas de
            NENHUMA tabela. Se for um job de ETL, confirme que ele faz commit em
            lotes. Consulte com:
            SELECT pid, state, xact_start, query FROM pg_stat_activity
            WHERE xact_start < now() - interval '1 hour';

      - alert: WraparoundSeAproximando
        # 1B << shutdown forçado em 2B; autovacuum_freeze_max_age default = 200M.
        expr: pg_database_wraparound_age_datfrozenxid_seconds > 1e9
        for: 30m
        labels:
          severity: critical
          runbook: postgres/docs/troubleshooting.md
        annotations:
          summary: "datfrozenxid de {{ $labels.datname }} acima de 1 bilhão"
          description: >-
            Com carga em massa de dezenas de milhões de linhas por rodada isto é
            risco real. Se chegar a 2 bilhões o Postgres PARA de aceitar escrita.

      - alert: MuitosArquivosTemporarios
        # work_mem insuficiente → spill em disco.
        expr: rate(pg_stat_database_temp_bytes[10m]) > 50 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 50 MB/s de arquivos temporários em {{ $labels.datname }}"
          description: >-
            Queries estão derramando em disco. Verifique work_mem do perfil e o
            plano das consultas pesadas — log_temp_files já está em 10MB, então
            os candidatos estão no log.

      - alert: CheckpointsForcadosDemais
        # checkpoint_timeout 15min; maioria "requested" → max_wal_size pequeno.
        expr: |
          rate(pg_stat_checkpointer_num_requested_total[30m])
            > rate(pg_stat_checkpointer_num_timed_total[30m])
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Mais checkpoints forçados que agendados"
          description: >-
            Aumente max_wal_size no perfil. Sem o collector.stat_checkpointer
            este alerta não existiria: o PG17 moveu estes campos para fora do
            pg_stat_bgwriter.

      - alert: DeadlocksFrequentes
        expr: rate(pg_stat_database_deadlocks[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks em {{ $labels.datname }}"
          description: >-
            log_lock_waits já está ligado — os detalhes estão no log do container.

      - alert: CacheHitBaixo
        # 30m: evita disparo durante ETL com leitura fria legítima.
        expr: |
          sum by (instance) (rate(pg_stat_database_blks_hit[30m]))
            / clamp_min(
                sum by (instance) (
                  rate(pg_stat_database_blks_hit[30m])
                  + rate(pg_stat_database_blks_read[30m])
                ), 1
              ) < 0.95
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Cache hit ratio abaixo de 95% na última hora"
