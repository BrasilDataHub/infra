# Alertas de backup físico e arquivamento de WAL — BrasilDataHub.
#
# archive_mode=on com archive_command falhando retém WAL no pg_wal até o disco
# encher. ArquivamentoDeWalParado é pré-condição de ligar o archive_mode.
#
# Fontes independentes: pg_stat_archiver_* (visão do banco) e pgbackrest_*
# (textfile do sidecar — o que existe no repositório).

groups:
  - name: arquivamento-wal
    rules:
      - alert: ArquivamentoDeWalParado
        # Limiar 23400s = intervalo do check pgBackRest (6h) + 30 min.
        # archive_timeout não gera WAL sem escrita; falha real coberta por ArquivamentoDeWalFalhando.
        expr: pg_stat_archiver_last_archive_age > 23400
        for: 10m
        labels:
          severity: critical
          runbook: postgres/backup/README.md
        annotations:
          summary: "Nenhum WAL arquivado há mais de 6h30"
          description: >-
            Nem a escrita normal nem o `check` de 6h do pgBackRest fecharam um
            segmento. O pg_wal pode estar retendo segmentos. Verifique
            `docker logs postgres-postgres-1 | grep archive` e
            `pgbackrest --stanza=<stanza> check`. Se o repositório estiver
            inacessível, o disco do banco enche — meça o espaço livre AGORA com
            `df -h` no volume do PGDATA antes de investigar a causa. Num banco
            de escrita rara, confirme antes se o sidecar do pgBackRest está no
            ar: sem o `check` periódico, um banco ocioso não fecha segmento e
            este alerta dispara sem haver falha.

      - alert: ArquivamentoDeWalFalhando
        # Falha isolada é recuperável; 15m captura falha persistente.
        expr: increase(pg_stat_archiver_failed_count[15m]) > 0
        for: 5m
        labels:
          severity: warning
          runbook: postgres/backup/README.md
        annotations:
          summary: "archive_command falhando ({{ $value | printf \"%.0f\" }} tentativas em 15 min)"
          description: >-
            O Postgres reexecuta o comando, então isto ainda não é perda. Se
            continuar, vira ArquivamentoDeWalParado — que é perda iminente.

      - alert: ArquivamentoDeWalNuncaAconteceu
        # absent() e não == 0: com archive_mode=off a série não é publicada.
        expr: absent(pg_stat_archiver_last_archive_age)
        for: 30m
        labels:
          severity: critical
          runbook: postgres/backup/README.md
        annotations:
          summary: "O Postgres nunca arquivou um segmento de WAL"
          description: >-
            Ou archive_mode está off, ou nenhum segmento foi fechado desde o
            start. Sem arquivamento não há PITR: o RPO volta a ser o intervalo
            entre backups completos.

  - name: pgbackrest
    rules:
      - alert: MetricasDeBackupAusentes
        # Sem esta série o resto do grupo fica cego (sidecar/textfile/bind).
        expr: absent(pgbackrest_info_ok)
        for: 1h
        labels:
          severity: warning
          runbook: postgres/backup/README.md
        annotations:
          summary: "Nenhuma métrica do pgBackRest está chegando"
          description: >-
            Confira `docker ps | grep pgbackrest` e se o node_exporter está com
            --collector.textfile.directory apontando para o mesmo diretório do
            bind do sidecar.

      - alert: RepositorioDeBackupComProblema
        expr: pgbackrest_info_ok == 0 or pgbackrest_repo_status_code != 0
        for: 15m
        labels:
          severity: critical
          runbook: postgres/backup/README.md
        annotations:
          summary: "pgbackrest info reporta a stanza {{ $labels.stanza }} com problema"
          description: >-
            Código {{ $value }}. Rode `pgbackrest --stanza={{ $labels.stanza }}
            info` no sidecar para a mensagem completa.

      - alert: NenhumBackupCompleto
        expr: pgbackrest_backup_count{type="full"} == 0
        for: 10m
        labels:
          severity: critical
          runbook: postgres/backup/README.md
        annotations:
          summary: "A stanza {{ $labels.stanza }} não tem nenhum backup completo"
          description: >-
            Rode `docker exec <sidecar> pgbackrest-backup-run.sh full`. Enquanto
            isto estiver disparando, um DROP TABLE CASCADE do ETL é irreversível.

      - alert: BackupCompletoAtrasado
        # Full semanal; 9 dias = margem de um domingo perdido.
        expr: time() - pgbackrest_backup_last_completion_timestamp_seconds{type="full"} > 9 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          runbook: postgres/backup/README.md
        annotations:
          summary: "O último backup completo de {{ $labels.stanza }} tem mais de 9 dias"
          description: >-
            Com repo1-retention-full=2, dois fulls perdidos começam a comer a
            janela de retenção dos diffs que dependem deles.

      - alert: BackupDiferencialAtrasado
        expr: |
          min by (stanza) (
            time() - pgbackrest_backup_last_completion_timestamp_seconds{type=~"diff|full"}
          ) > 48 * 3600
        for: 1h
        labels:
          severity: warning
          runbook: postgres/backup/README.md
        annotations:
          summary: "Sem backup (full ou diff) de {{ $labels.stanza }} há mais de 48 h"
          description: >-
            O RPO continua protegido pelo WAL enquanto o arquivamento estiver
            de pé, mas o RTO cresce: cada dia sem diff é mais WAL a reaplicar
            no restore.

      - alert: ExecucaoDeBackupFalhou
        expr: pgbackrest_run_last_success == 0
        for: 10m
        labels:
          severity: critical
          runbook: postgres/backup/README.md
        annotations:
          summary: "A última execução '{{ $labels.type }}' do backup de {{ $labels.stanza }} falhou"
          description: >-
            Difere de BackupCompletoAtrasado de propósito: aqui o agendamento
            RODOU e deu erro, o que costuma ser credencial, cota do bucket ou
            disco. `docker logs` do sidecar tem a mensagem.

      - alert: SemSegmentosDeWalNoRepositorio
        # Full sem WAL = RPO = idade do full. `on (instance, stanza)`: rótulos
        # dos lados diferem; sem `on` a regra nunca casa.
        expr: |
          pgbackrest_archive_segments_present == 0
            and on (instance, stanza) (pgbackrest_backup_count{type="full"} > 0)
        for: 30m
        labels:
          severity: critical
          runbook: postgres/backup/README.md
        annotations:
          summary: "Há backup completo mas nenhum WAL no repositório de {{ $labels.stanza }}"
          description: >-
            Sem WAL não há PITR: o RPO é a idade do último full, não segundos.
