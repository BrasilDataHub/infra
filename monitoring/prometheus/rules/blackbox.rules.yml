# Sondas de caixa-preta e SLO HTTP — BrasilDataHub.
# Limiares por classe de página (média entre classes esconde a lenta).
# p95 em 30 min: probe a cada 60s → ~30 amostras.

groups:
  - name: sondas
    rules:
      - record: slo:probe_duracao_p95_30m
        expr: quantile_over_time(0.95, probe_duration_seconds[30m])

      - record: slo:probe_duracao_p50_30m
        expr: quantile_over_time(0.50, probe_duration_seconds[30m])

      - record: slo:probe_disponibilidade_1d
        expr: avg_over_time(probe_success[1d])

      - alert: SondaFalhando
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "A sonda {{ $labels.module }} falha em {{ $labels.instance }}"
          description: >-
            Cinco minutos, e não um: a origem tem uma réplica só, e um deploy
            legítimo derruba a sonda por alguns segundos. Se `probe_success` está
            em 0 e `probe_http_status_code` está em 200, o que falhou foi uma
            das verificações de CONTEÚDO ou de CABEÇALHO do módulo — veja
            monitoring/blackbox/blackbox.yml.

      - alert: DisponibilidadeAbaixoDoSlo
        # 99,5% em 1d = 7,2 min de indisponibilidade (sem HA nas Fases 1-3).
        expr: slo:probe_disponibilidade_1d < 0.995
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} abaixo de 99,5% nas últimas 24 h"

      - alert: SloBordaHitEstourado
        # Borda HIT: p95 60 ms.
        expr: slo:probe_duracao_p95_30m{module="borda_hit"} > 0.060
        for: 15m
        labels:
          severity: warning
          classe: borda-hit
        annotations:
          summary: "p95 da borda em {{ $value | printf \"%.3f\" }}s (SLO 0,060s)"
          description: >-
            Se `probe_success` do mesmo alvo está em 1, a borda está servindo —
            só que devagar. Se estiver em 0, o problema é a Cache Rule, não a
            latência.

      - alert: SloCondicional304Estourado
        expr: slo:probe_duracao_p95_30m{module="condicional_304"} > 0.040
        for: 15m
        labels:
          severity: warning
          classe: condicional-304
        annotations:
          summary: "p95 do 304 condicional em {{ $value | printf \"%.3f\" }}s (SLO 0,040s)"

      - alert: SloEmpresaPorCnpjEstourado
        expr: slo:probe_duracao_p95_30m{module="empresa_por_cnpj"} > 0.200
        for: 15m
        labels:
          severity: warning
          classe: empresa-cnpj
        annotations:
          summary: "p95 da página de empresa em {{ $value | printf \"%.3f\" }}s (SLO 0,200s)"
          description: >-
            A consulta por CNPJ no Postgres é de 0,122 ms. Um p95 acima de 200
            ms nesta classe é aplicação, não banco.

      - alert: SloHubTerritorialEstourado
        expr: slo:probe_duracao_p95_30m{module="hub_territorial"} > 0.250
        for: 15m
        labels:
          severity: warning
          classe: hub-cidade-cnae
        annotations:
          summary: "p95 do hub territorial em {{ $value | printf \"%.3f\" }}s (SLO 0,250s)"

      - alert: SloAutocompleteEstourado
        expr: slo:probe_duracao_p95_30m{module="autocomplete"} > 0.080
        for: 15m
        labels:
          severity: warning
          classe: autocomplete
        annotations:
          summary: "p95 do autocomplete em {{ $value | printf \"%.3f\" }}s (SLO 0,080s)"
          description: >-
            O autocomplete por prefixo no Postgres é de 1,207 ms — por isso os
            cinco índices de catálogo NÃO saem do banco. Um p95 de 80 ms aqui é
            fila de aplicação.

      - alert: SloBuscaEstourado
        expr: slo:probe_duracao_p95_30m{module="busca"} > 0.200
        for: 15m
        labels:
          severity: warning
          classe: busca-avancada
        annotations:
          summary: "p95 da busca em {{ $value | printf \"%.3f\" }}s (SLO 0,200s)"

  - name: borda-e-cabecalhos
    rules:
      - alert: RotaAnonimaVazandoEstadoDeSessao
        # Set-Cookie / Cache-Control privado em rota anônima: cacheia sessão ou perde HIT.
        expr: probe_success{module="anonima_sem_cookie"} == 0
        for: 5m
        labels:
          severity: critical
          runbook: "03-arquitetura-de-busca.md §6.4"
        annotations:
          summary: "Rota pública {{ $labels.instance }} emitindo cookie ou cache privado"
          description: >-
            Alguém pôs um @auth, um `session()` ou um middleware de sessão numa
            rota anônima. Os dois testes de regressão de cabeçalho do website
            cobrem isto no CI; esta sonda cobre em produção, que é onde a Cache
            Rule existe. Reverta antes de purgar o cache.

      - alert: BordaParouDeCachear
        # Separado de SondaFalhando: falha específica de cf-cache-status.
        expr: |
          probe_success{module="borda_hit"} == 0
            and on (instance) (probe_success{module="pagina_publica"} == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A origem responde, mas a borda não está cacheando {{ $labels.instance }}"
          description: >-
            A página está de pé e o cf-cache-status saiu de HIT. Causas usuais,
            em ordem: a Cache Rule foi alterada, a resposta ganhou Set-Cookie,
            ou o s-maxage voltou a zero. O par de sondas separa "site caiu" de
            "cache caiu" sem investigação.

      - alert: CertificadoExpirando
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificado de {{ $labels.instance }} expira em menos de 14 dias"
          description: >-
            Com a Cloudflare na frente, o certificado que a sonda vê é o da
            borda. Um vencimento aqui costuma ser de origem, no Traefik.

      - alert: PortaDeDadosAlcancavelDeFora
        # Inversão: probe_success == 1 é o problema (porta que deveria estar fechada).
        expr: probe_success{module="tcp_conecta", esperado="fechado"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} aceita conexão de onde não deveria"
          description: >-
            A regra de ufw/DOCKER-USER caiu. `setup.sh --metrics-only` sem
            --allow-from esvazia a chain e não a repovoa — é a causa
            mais provável.
