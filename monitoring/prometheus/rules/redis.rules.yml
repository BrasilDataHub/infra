# Alertas do Redis — BrasilDataHub.
#
# O Redis aqui acumula dois papéis na mesma instância: cache do Laravel e fila do
# Horizon. É isso que torna `evicted_keys` um alerta sério e não uma curiosidade
# — ver a justificativa de volatile-lru em redis/README.md.

groups:
  - name: redis
    rules:
      - alert: RedisDespejandoChaves
        # Com volatile-lru, só chaves COM TTL são despejadas. Como as chaves de
        # fila do Horizon não têm TTL, um despejo significa que o cache está
        # sendo perdido — e, se alguma chave de fila ganhou TTL por engano,
        # significa TRABALHO PERDIDO. Nos dois casos, é hora de subir de perfil.
        expr: rate(redis_evicted_keys_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis despejando chaves por falta de memória"
          description: >-
            maxmemory foi atingido. Suba o perfil (redis/README.md) — lembrando
            que o limite do container deve ficar em ~2x maxmemory por causa do
            fork copy-on-write do rewrite do AOF.

      - alert: RedisPertoDoMaxmemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Redis acima de 90% do maxmemory"

      - alert: RedisRecusandoConexoes
        expr: rate(redis_rejected_connections_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis recusando conexões (limite de clientes atingido)"
          description: >-
            O Horizon abre uma conexão por worker. Verifique quantos workers
            estão configurados contra o maxclients do Redis.

      - alert: FilaDoHorizonCrescendo
        # Só existe se REDIS_METRICS_KEYS estiver definido no .env do Redis
        # (-check-single-keys). Sem isso, não há série e a regra fica inerte.
        # Fila que só cresce = worker morto ou job travando.
        expr: |
          redis_key_size > 10000
            and deriv(redis_key_size[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Fila {{ $labels.key }} com {{ $value | humanize }} itens e crescendo"
          description: >-
            Trinta minutos de crescimento contínuo indica worker parado ou job
            que falha e volta para a fila. Verifique o Horizon.
