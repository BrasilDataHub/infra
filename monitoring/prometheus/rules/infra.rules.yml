# Alertas de infraestrutura (host e coleta) — BrasilDataHub.
# Coleta primeiro: up==0 (alvo não responde) vs absent(up) (alvo sumiu da config).

groups:
  - name: coleta
    rules:
      - alert: AlvoForaDoAr
        # 5m: scrape isolado sob IO saturado pode estourar timeout de 10s.
        # `host` vem do arquivo de alvos (não só external_labels).
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alvo {{ $labels.job }} do servidor {{ $labels.host }} não responde há 5 minutos"
          description: >-
            O Prometheus não consegue coletar de {{ $labels.instance }}
            (job {{ $labels.job }}, servidor {{ $labels.host }}). Verifique com
            `bdh logs <serviço>` e `bdh metrics`.

      - alert: ServidorSemColeta
        # sum by (host): distingue "um exporter caiu" de "máquina/rede inteira".
        expr: sum by (host) (up{host!=""}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nenhum alvo do servidor {{ $labels.host }} responde"
          description: >-
            Todos os coletores desta máquina estão fora do ar ao mesmo tempo —
            o que costuma ser a máquina, o firewall ou a rota privada, não os
            serviços. Confira `bdh metrics` no host do Prometheus.

      - alert: JobSemAlvo
        expr: absent(up{job="postgres"}) or absent(up{job="node"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.job }} não tem nenhum alvo configurado"
          description: >-
            O arquivo em /etc/prometheus/targets/ correspondente sumiu ou está
            vazio. A monitoração deste serviço está desligada sem ninguém ter
            pedido.

  - name: notificacao
    rules:
      - alert: AlertmanagerForaDoAr
        # Sem AM, regras avaliam e não notificam. Par com AlertmanagerSemDestino no Grafana.
        expr: absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager fora do ar — nenhum alerta está sendo notificado"
          description: >-
            Causa mais provável: nenhuma env de destino definida. O container
            recusa subir sem receiver de propósito
            (monitoring/alertmanager/generate-config.sh).

      - alert: NotificacaoFalhando
        expr: rate(alertmanager_notifications_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Falha ao entregar notificação por {{ $labels.integration }}"
          description: >-
            O alerta foi avaliado, agrupado e a entrega falhou. Webhook fora do
            ar, token expirado ou SMTP recusando. Enquanto durar, a stack está
            cega na prática.

  - name: host
    rules:
      - alert: DiscoQuaseCheio
        # 15% livres. Complementado por EspacoCriticoNoBanco (absoluto).
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Menos de 15% livres em {{ $labels.mountpoint }} ({{ $labels.host }})"
          description: >-
            Este é o modo de falha mais perigoso da stack: o volume do Prometheus
            e o do Postgres dividem o mesmo NVMe, então uma explosão de
            cardinalidade enche o disco e derruba o BANCO, não o Prometheus.
            Confira PROM_RETENTION_SIZE antes de culpar os dados. Plano de espaço
            do ciclo mensal em postgres/docs/armazenamento.md.

      - alert: EspacoCriticoNoBanco
        # Absoluto no PGDATA (/): 15 GB não cabem checkpoint grande nem pg_wal (~max_wal_size).
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint="/"}
            < 15 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: critical
          runbook: postgres/docs/armazenamento.md
        annotations:
          summary: "Menos de 15 GB livres no disco do banco ({{ $labels.host }})"
          description: >-
            Abaixo disto um checkpoint grande ou um crescimento de pg_wal enche o
            disco e derruba o Postgres. Se estiver na janela da carga mensal,
            confira o plano de espaço em postgres/docs/armazenamento.md; fora
            dela, verifique se o archive_command está funcionando — WAL que não é
            arquivado não é reciclado e cresce ignorando max_wal_size.

      - alert: DiscoEncheEm24h
        # Guarda <30% livres: predict_linear confunde degrau de backup full com tendência.
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600
          ) < 0
          and
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.30
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} de {{ $labels.host }} deve encher em menos de 24h"

      - alert: MemoriaDoHostCritica
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Menos de 10% de memória disponível em {{ $labels.host }}"
          description: >-
            Verifique a soma dos limites dos containers contra a RAM real —
            a fórmula de coexistência está em postgres/docs/perfis.md, e a stack
            de métricas também consome (monitoring/README.md).

      - alert: MemoriaSobPressao
        # PSI de memória: sinal precoce (reclaim) enquanto MemAvailable ainda parece ok.
        expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Processos de {{ $labels.host }} parados por pressão de memória mais de 5% do tempo"
          description: >-
            O kernel está descartando page cache para atender alocações. Num
            host em que a saturação medida é de page cache, isto se traduz
            diretamente em amplificação de leitura no Postgres. Confira a soma
            dos limites dos containers antes de olhar para o Postgres.

      - alert: IOSaturado
        # PSI, não %util: em NVMe %util satura sem o disco estar no limite.
        expr: rate(node_pressure_io_stalled_seconds_total[5m]) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Processos de {{ $labels.host }} parados esperando IO mais de 30% do tempo"

  - name: containers
    rules:
      - alert: ContainerPertoDoLimiteDeMemoria
        # Requer cAdvisor (COMPOSE_PROFILES=containers).
        expr: |
          container_memory_working_set_bytes{name!=""}
            / container_spec_memory_limit_bytes{name!=""} > 0.90
            and container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} acima de 90% do limite de memória"
          description: >-
            O próximo passo é OOMKill. Se for o Postgres, revise o perfil —
            um perfil aplicado pela metade (envs sem o limite de container)
            também produz este sintoma.
