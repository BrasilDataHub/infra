# Alertas de infraestrutura (host e coleta) — BrasilDataHub.
#
# Regra de ouro deste arquivo: monitoração que falha em silêncio é pior que
# nenhuma. Por isso o primeiro grupo cobre a própria coleta, e usa `absent()`
# além de `up == 0` — os dois pegam falhas diferentes:
#
#   up == 0        o alvo existe na configuração e não respondeu
#   absent(up{…})  o alvo SUMIU da configuração (arquivo de target apagado,
#                  serviço removido do host) — o `up == 0` nunca dispararia,
#                  porque não há série nenhuma para avaliar.

groups:
  - name: coleta
    rules:
      - alert: AlvoForaDoAr
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alvo {{ $labels.job }} do servidor {{ $labels.host }} não responde há 5 minutos"
          description: >-
            O Prometheus não consegue coletar de {{ $labels.instance }}
            (job {{ $labels.job }}, servidor {{ $labels.host }}). Verifique com
            `bdh logs <serviço>` e `bdh metrics`.
      # 5m e não 1m: sob ETL com IO saturado, um scrape pode estourar o
      # scrape_timeout de 10s isoladamente. Alertar em cima disso geraria ruído
      # constante e treinaria a operação a ignorar o alerta.
      #
      # O `host` vem do ARQUIVO DE ALVOS (setup.sh o escreve em cada um), não
      # dos external_labels: estes só são aplicados a rótulos AUSENTES na saída,
      # então o nome real da máquina vence e o do monitor fica como reserva para
      # os alertas de `absent()`, que não têm série nenhuma de onde herdar.

      - alert: ServidorSemColeta
        # `sum by (host)` e não `count(up == 1) == 0`: quando todos os alvos de
        # uma máquina estão em 0, a série CONTINUA existindo com valor 0 — o
        # grupo não some e a comparação avalia. É o que distingue "um exporter
        # caiu" de "a máquina (ou a rede privada até ela) caiu inteira", e o
        # segundo caso é o que o AlvoForaDoAr entrega como N alertas separados.
        expr: sum by (host) (up{host!=""}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nenhum alvo do servidor {{ $labels.host }} responde"
          description: >-
            Todos os coletores desta máquina estão fora do ar ao mesmo tempo —
            o que costuma ser a máquina, o firewall ou a rota privada, não os
            serviços. Confira `bdh metrics` no host do Prometheus.

      - alert: JobSemAlvo
        # Vale para os jobs que o deploy declarou. Se o arquivo de target sumir,
        # o job continua na config mas fica sem série — e nada mais avisaria.
        expr: absent(up{job="postgres"}) or absent(up{job="node"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.job }} não tem nenhum alvo configurado"
          description: >-
            O arquivo em /etc/prometheus/targets/ correspondente sumiu ou está
            vazio. A monitoração deste serviço está desligada sem ninguém ter
            pedido.

  - name: notificacao
    rules:
      - alert: AlertmanagerForaDoAr
        # Sem ele, TODA regra desta stack volta ao estado anterior a este
        # roadmap: avaliada, visível no Prometheus, e sem destino nenhum. É o
        # único alerta que, ao disparar, não consegue ser entregue — daí o par
        # com AlertmanagerSemDestino no Grafana.
        expr: absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager fora do ar — nenhum alerta está sendo notificado"
          description: >-
            Causa mais provável: nenhuma env de destino definida. O container
            recusa subir sem receiver de propósito
            (monitoring/alertmanager/generate-config.sh).

      - alert: NotificacaoFalhando
        expr: rate(alertmanager_notifications_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Falha ao entregar notificação por {{ $labels.integration }}"
          description: >-
            O alerta foi avaliado, agrupado e a entrega falhou. Webhook fora do
            ar, token expirado ou SMTP recusando. Enquanto durar, a stack está
            cega na prática.

  - name: host
    rules:
      - alert: DiscoQuaseCheio
        # 15% livres = dispara a 85% de uso. O ciclo mensal não leva o disco do
        # banco a esse patamar: a geração N−1 vai para o volume de backup, e o
        # local acomoda só a geração corrente mais o pg_wal.
        #
        # Complementado por `EspacoCriticoNoBanco`, que olha espaço absoluto —
        # em disco grande a porcentagem reage tarde demais.
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Menos de 15% livres em {{ $labels.mountpoint }} ({{ $labels.host }})"
          description: >-
            Este é o modo de falha mais perigoso da stack: o volume do Prometheus
            e o do Postgres dividem o mesmo NVMe, então uma explosão de
            cardinalidade enche o disco e derruba o BANCO, não o Prometheus.
            Confira PROM_RETENTION_SIZE antes de culpar os dados. Plano de espaço
            do ciclo mensal em postgres/docs/armazenamento.md.

      - alert: EspacoCriticoNoBanco
        # Espaço ABSOLUTO, e só no filesystem que hospeda o PGDATA.
        #
        # Porcentagem e espaço absoluto respondem a perguntas diferentes, e a
        # porcentagem reage mais tarde quanto maior o disco. Este alerta garante
        # um piso que não depende do tamanho do dispositivo: 15 GB não comportam
        # um checkpoint grande nem o crescimento de `pg_wal` (que pode chegar a
        # 32 GB pelo `max_wal_size`) em disco nenhum.
        #
        # `mountpoint="/"` porque é onde o PGDATA vive; o volume de backup tem
        # perfil de crescimento previsível e não precisa deste limiar.
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", mountpoint="/"}
            < 15 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: critical
          runbook: postgres/docs/armazenamento.md
        annotations:
          summary: "Menos de 15 GB livres no disco do banco ({{ $labels.host }})"
          description: >-
            Abaixo disto um checkpoint grande ou um crescimento de pg_wal enche o
            disco e derruba o Postgres. Se estiver na janela da carga mensal,
            confira o plano de espaço em postgres/docs/armazenamento.md; fora
            dela, verifique se o archive_command está funcionando — WAL que não é
            arquivado não é reciclado e cresce ignorando max_wal_size.

      - alert: DiscoEncheEm24h
        # predict_linear pega o crescimento antes de virar incidente. Janela de
        # 6h para não reagir a um pico pontual de ETL.
        #
        # A segunda condição — menos de 30% livres — existe porque
        # `predict_linear` é regressão linear, e uma escrita em DEGRAU a domina.
        # Um backup full escreve dezenas de GB de uma vez; a regressão sobre a
        # janela lê isso como tendência e projeta o disco enchendo, mesmo com o
        # volume quase vazio. Medido: um full de 47 GB num volume com 79% livres
        # produziu previsão de −119 GB.
        #
        # Com a guarda, a previsão só alerta quando já há pouco espaço — que é
        # quando ela de fato importa. Encher de verdade continua coberto por
        # `DiscoQuaseCheio` e, no disco do banco, por `EspacoCriticoNoBanco`.
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24 * 3600
          ) < 0
          and
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.30
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} de {{ $labels.host }} deve encher em menos de 24h"

      - alert: MemoriaDoHostCritica
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Menos de 10% de memória disponível em {{ $labels.host }}"
          description: >-
            Verifique a soma dos limites dos containers contra a RAM real —
            a fórmula de coexistência está em postgres/docs/perfis.md, e a stack
            de métricas também consome (monitoring/README.md).

      - alert: MemoriaSobPressao
        # Complementa MemoriaDoHostCritica, que olha MemAvailable. O PSI de
        # memória é um sinal MAIS PRECOCE: ele mede o tempo em que processos
        # ficaram parados por causa de reclaim, e sobe enquanto o MemAvailable
        # ainda parece saudável — porque o kernel está descartando page cache
        # para não faltar memória. Num host cujo gargalo medido É page cache,
        # esse é o número que importa.
        #
        # Media 0,0975 no diagnóstico de 28/07 — ou seja, DISPARARIA hoje. É um
        # verdadeiro positivo, não uma calibragem folgada.
        expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Processos de {{ $labels.host }} parados por pressão de memória mais de 5% do tempo"
          description: >-
            O kernel está descartando page cache para atender alocações. Num
            host em que a saturação medida é de page cache, isto se traduz
            diretamente em amplificação de leitura no Postgres. Confira a soma
            dos limites dos containers antes de olhar para o Postgres.

      - alert: IOSaturado
        # PSI, e não %util: em NVMe o %util satura em 100% sem que o disco esteja
        # realmente no limite. O stall time é o que distingue "ETL pesado" de
        # "disco no teto".
        expr: rate(node_pressure_io_stalled_seconds_total[5m]) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Processos de {{ $labels.host }} parados esperando IO mais de 30% do tempo"

  - name: containers
    rules:
      - alert: ContainerPertoDoLimiteDeMemoria
        # Só existe com o cAdvisor ligado (COMPOSE_PROFILES=containers). É o par
        # de métricas que teria detectado o incidente de Memory=0 documentado em
        # postgres/docs/troubleshooting.md.
        expr: |
          container_memory_working_set_bytes{name!=""}
            / container_spec_memory_limit_bytes{name!=""} > 0.90
            and container_spec_memory_limit_bytes{name!=""} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} acima de 90% do limite de memória"
          description: >-
            O próximo passo é OOMKill. Se for o Postgres, revise o perfil —
            um perfil aplicado pela metade (envs sem o limite de container)
            também produz este sintoma.
