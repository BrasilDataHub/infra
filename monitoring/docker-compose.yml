# Observabilidade de produção — Prometheus, Grafana, Alertmanager e coletores de host.
# Exporters de Postgres/Redis ficam nos módulos dos serviços (rede bdh_metrics).
#
#   GRAFANA_ADMIN_PASSWORD=...
#   PROM_RETENTION_TIME=30d
#   PROM_RETENTION_SIZE=2GB
#   MON_HOSTNAME=vps-bdh-01
#   # MONITORING_BIND_IP=127.0.0.1   # NÃO reusar BIND_IP (default 0.0.0.0)
#   # COMPOSE_PROFILES=node         # +containers para cAdvisor
#
# Antes do primeiro up: mkdir -p targets secrets && touch secrets/meili-metrics.key

services:
  prometheus:
    image: ghcr.io/brasildatahub/prometheus:3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MON_HOSTNAME: ${MON_HOSTNAME:-desconhecido}
    # Label curta só no Prometheus — setup filtra service=monitoring.
    labels:
      org.brasildatahub.service: monitoring
    command:
      # command substitui o CMD da imagem; repetir as flags base.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Tempo E tamanho: cardinalidade pode encher o disco (mesmo NVMe do PG) antes de 30d.
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    volumes:
      - prom_data:/prometheus
      - ./targets:/etc/prometheus/targets:ro
      # Bind de arquivo + create_host_path false: path ausente falha no up (não vira dir).
      - type: bind
        source: ./secrets/meili-metrics.key
        target: /etc/prometheus/secrets/meili-metrics.key
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Default 127.0.0.1: Prometheus sem auth. Variável própria (não BIND_IP).
      - "${MONITORING_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          # Sem teto interno: OOMKill no meio da compactação força replay do WAL.
          memory: ${PROM_MEMORY_LIMIT:-512M}
          cpus: "${PROM_CPU_LIMIT:-2}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: ghcr.io/brasildatahub/grafana:13
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Flag SEPARADA da de cima: `analytics.check_for_updates` cobre o Grafana,
      # `plugins.preinstall_auto_update` cobre os plugins — e ela roda mesmo com
      # `GF_INSTALL_PLUGINS` vazio. Sem esta, o checker registra uma linha de
      # avaliação de flag a cada poucos minutos: 518 em 24 h, num host de 2 GB
      # onde o log do Grafana já é o maior arquivo do serviço.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Vazio: plugin aqui = download no boot (quebra com egress bloqueado).
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    labels:
      org.brasildatahub.service: monitoring-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${MONITORING_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
          cpus: "${GRAFANA_CPU_LIMIT:-1}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

  alertmanager:
    image: ghcr.io/brasildatahub/alertmanager:0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Pelo menos um destino — senão o container não sobe (generate-config.sh).
      ALERTMANAGER_SLACK_WEBHOOK: ${ALERTMANAGER_SLACK_WEBHOOK:-}
      ALERTMANAGER_SLACK_CHANNEL: ${ALERTMANAGER_SLACK_CHANNEL:-}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
      ALERTMANAGER_EMAIL_FROM: ${ALERTMANAGER_EMAIL_FROM:-}
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-}
      ALERTMANAGER_SMTP_USER: ${ALERTMANAGER_SMTP_USER:-}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
      ALERTMANAGER_ETL_TIMEZONE: ${ALERTMANAGER_ETL_TIMEZONE:-America/Sao_Paulo}
      ALERTMANAGER_ETL_DAYS_OF_MONTH: ${ALERTMANAGER_ETL_DAYS_OF_MONTH:-1:7}
      ALERTMANAGER_ETL_WEEKDAY: ${ALERTMANAGER_ETL_WEEKDAY:-saturday}
      ALERTMANAGER_ETL_START: ${ALERTMANAGER_ETL_START:-00:00}
      ALERTMANAGER_ETL_END: ${ALERTMANAGER_ETL_END:-07:00}
    # --web.external-url obrigatória: sem ela title_link usa hostname do container
    # e destinos que validam URL (ex. Discord) recusam a notificação.
    command:
      - /bin/alertmanager
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    labels:
      org.brasildatahub.service: alertmanager
    volumes:
      # Silences/nflog: perder o volume re-notifica alertas ativos e apaga silences de ETL.
      - alertmanager_data:/alertmanager
    ports:
      # 127.0.0.1: API de silences sem auth.
      - "${MONITORING_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - default
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-128M}
          cpus: "${ALERTMANAGER_CPU_LIMIT:-0.5}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    # Profile Compose (COMPOSE_PROFILES). Desligado no macOS: /proc da VM + sem PSI.
    profiles: [node]
    # nodename do container = ID; hostname força o nome do host nos painéis.
    hostname: ${MON_HOSTNAME:-desconhecido}
    pid: host
    volumes:
      # rslave: disco montado após o start continua visível.
      - /:/host:ro,rslave
      # Textfile: sidecar pgBackRest escreve; bind de dir do host (projetos distintos).
      - type: bind
        source: ${NODE_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}
        target: /var/lib/node_exporter/textfile
        read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      # Path do MOUNT, não prefixar com /host.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      # $$ escapa interpolação do Compose (regex vazia = filtro inerte).
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker[0-9]+)$$
      - --collector.netclass.ignored-devices=^(veth.*|br-.*|docker[0-9]+)$$
      - --collector.diskstats.device-exclude=^(ram|loop|fd|dm-|sr|nbd)\d+$$
      - --no-collector.wifi
      - --no-collector.hwmon
      - --no-collector.thermal_zone
      - --no-collector.infiniband
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.mdadm
      - --no-collector.zfs
      - --no-collector.btrfs
      - --no-collector.bonding
      - --no-collector.ipvs
      - --no-collector.fibrechannel
      - --no-collector.tapestats
      - --no-collector.selinux
      - --no-collector.dmi
      - --no-collector.rapl
      - --no-collector.edac
      - --no-collector.powersupplyclass
      # pressure (PSI) ligado: distingue ETL pesado de disco saturado.
    labels:
      org.brasildatahub.service: node-exporter
    networks:
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
          cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.5}"

  blackbox-exporter:
    image: ghcr.io/brasildatahub/blackbox-exporter:0
    restart: unless-stopped
    # Sem profile: único componente que mede experiência do usuário (substitui Pulse).
    labels:
      org.brasildatahub.service: blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=0.0.0.0:9115
      - --log.level=warn
    # Sem ports: /probe é proxy aberto.
    networks:
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${BLACKBOX_MEMORY_LIMIT:-128M}
          cpus: "${BLACKBOX_CPU_LIMIT:-0.5}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.60.5
    restart: unless-stopped
    # Desligado por default (COMPOSE_PROFILES=containers). Memória por container.
    profiles: [containers]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=org.brasildatahub.service
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    labels:
      org.brasildatahub.service: cadvisor
    networks:
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEMORY_LIMIT:-512M}
          cpus: "${CADVISOR_CPU_LIMIT:-1}"

volumes:
  prom_data:
    driver: local
    name: ${PROM_VOLUME:-bdh_prom_data}
  grafana_data:
    driver: local
    name: ${GRAFANA_VOLUME:-bdh_grafana_data}
  alertmanager_data:
    driver: local
    name: ${ALERTMANAGER_VOLUME:-bdh_alertmanager_data}

networks:
  # Sem external: true — ver postgres/docker-compose.metrics.yml.
  bdh_metrics:
    name: ${METRICS_NETWORK:-bdh_metrics}
