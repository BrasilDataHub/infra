# Compose de PRODUÇÃO da observabilidade — mesma forma de deploy dos demais
# serviços (por quê: ../postgres/docs/estrategia-deploy.md).
#
# Este módulo é o único que observa os outros: Prometheus, Grafana e os coletores
# de escopo de máquina. Os exporters de Postgres e Redis NÃO estão aqui — vivem
# no módulo do serviço que observam (../postgres/docker-compose.metrics.yml), e
# são alcançados pela rede bdh_metrics.
#
# .env ao lado deste arquivo:
#   GRAFANA_ADMIN_PASSWORD=...        # obrigatória
#   PROM_RETENTION_TIME=30d           # bloco do perfil (README)
#   PROM_RETENTION_SIZE=2GB
#   PROM_MEMORY_LIMIT=512M
#   GRAFANA_MEMORY_LIMIT=512M
#   MON_HOSTNAME=vps-bdh-01           # rótulo `host` nas séries
#   # opcionais:
#   # MONITORING_BIND_IP=10.0.0.5     # default 127.0.0.1 — leia a nota abaixo
#   # PROMETHEUS_PORT=9090
#   # GRAFANA_PORT=3000
#   # COMPOSE_PROFILES=node           # +containers para ligar o cAdvisor
#
# ANTES do primeiro `up`, dois caminhos precisam existir no host:
#   mkdir -p targets secrets && touch secrets/meili-metrics.key
# O `setup.sh --metrics` faz isso. Sem eles o Prometheus não sobe — e o
# erro é explícito, de propósito (ver a nota no mount de secrets).

services:
  prometheus:
    image: ghcr.io/brasildatahub/prometheus:3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Expandida dentro do prometheus.yml (external_labels). O Prometheus 3
      # expande variáveis de ambiente na config nativamente.
      MON_HOSTNAME: ${MON_HOSTNAME:-desconhecido}
    # Só o Prometheus leva o nome curto: `setup.sh` espera o healthcheck
    # com `docker ps --filter label=org.brasildatahub.service=monitoring | head -1`,
    # e com labels iguais nos cinco containers ele observaria um ao acaso.
    labels:
      org.brasildatahub.service: monitoring
    command:
      # A imagem tem ENTRYPOINT /bin/prometheus; este command SUBSTITUI o CMD
      # default, então as duas primeiras flags precisam ser repetidas.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # As DUAS retenções, sempre. A de tempo sozinha não protege o disco: uma
      # explosão de cardinalidade enche o volume — que divide o NVMe com o
      # Postgres — muito antes de os 30 dias passarem.
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}
      - --web.listen-address=0.0.0.0:9090
      # Permite `curl -X POST /-/reload` para recarregar alvos sem restart.
      - --web.enable-lifecycle
    volumes:
      - prom_data:/prometheus
      # Alvos por host, escritos pelo setup.sh. Diretório vazio = nenhum
      # alvo, e é assim que um host sem Meilisearch não fica com um job órfão
      # eternamente em `up == 0`.
      - ./targets:/etc/prometheus/targets:ro
      # Bind de ARQUIVO, com create_host_path desligado de propósito: se o
      # arquivo não existir, o Docker criaria um DIRETÓRIO com esse nome e o
      # Prometheus falharia com um erro obscuro. Assim ele falha no `up`,
      # dizendo exatamente qual caminho falta.
      - type: bind
        source: ./secrets/meili-metrics.key
        target: /etc/prometheus/secrets/meili-metrics.key
        read_only: true
        bind:
          create_host_path: false
    ports:
      # 127.0.0.1 por DEFAULT — o OPOSTO dos serviços de dados, e de propósito.
      # Postgres/Redis/Meili abrem em 0.0.0.0 porque a aplicação vive em outra
      # máquina e a senha é a barreira. O Prometheus NÃO TEM AUTENTICAÇÃO
      # NENHUMA: quem alcança a porta lê tudo e chama /api/v1/admin/tsdb/*.
      #
      # Variável PRÓPRIA, nunca BIND_IP: o default do setup.sh é
      # --bind-ip 0.0.0.0, e reusá-la publicaria isto na internet.
      #
      #   ssh -L 9090:127.0.0.1:9090 -L 3000:127.0.0.1:3000 usuario@host
      - "${MONITORING_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default
      - bdh_metrics
    logging:
      # Teto de log — a justificativa está em ../postgres/docker-compose.yml.
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          # Folgado de propósito: o Prometheus não tem teto interno de memória, e
          # um OOMKill no meio da compactação obriga replay do WAL no restart.
          memory: ${PROM_MEMORY_LIMIT:-512M}
          cpus: "${PROM_CPU_LIMIT:-2}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: ghcr.io/brasildatahub/grafana:13
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Vazio de propósito: qualquer plugin aqui vira download no boot, e um VPS
      # com egress bloqueado ficaria preso no start sem explicação.
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    labels:
      org.brasildatahub.service: monitoring-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      # Mesma inversão do Prometheus: consumido por gente, e gente tem SSH.
      - "${MONITORING_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
          cpus: "${GRAFANA_CPU_LIMIT:-1}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

  alertmanager:
    image: ghcr.io/brasildatahub/alertmanager:0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # PELO MENOS UMA destas precisa existir, senão o container NÃO SOBE — e
      # essa recusa é o ponto do serviço. Ver alertmanager/generate-config.sh.
      ALERTMANAGER_SLACK_WEBHOOK: ${ALERTMANAGER_SLACK_WEBHOOK:-}
      ALERTMANAGER_SLACK_CHANNEL: ${ALERTMANAGER_SLACK_CHANNEL:-}
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_EMAIL_TO: ${ALERTMANAGER_EMAIL_TO:-}
      ALERTMANAGER_EMAIL_FROM: ${ALERTMANAGER_EMAIL_FROM:-}
      ALERTMANAGER_SMTP_HOST: ${ALERTMANAGER_SMTP_HOST:-}
      ALERTMANAGER_SMTP_USER: ${ALERTMANAGER_SMTP_USER:-}
      ALERTMANAGER_SMTP_PASSWORD: ${ALERTMANAGER_SMTP_PASSWORD:-}
      # Janela de silenciamento da carga mensal (05 §9.3-A e §9.4).
      ALERTMANAGER_ETL_TIMEZONE: ${ALERTMANAGER_ETL_TIMEZONE:-America/Sao_Paulo}
      ALERTMANAGER_ETL_DAYS_OF_MONTH: ${ALERTMANAGER_ETL_DAYS_OF_MONTH:-1:7}
      ALERTMANAGER_ETL_WEEKDAY: ${ALERTMANAGER_ETL_WEEKDAY:-saturday}
      ALERTMANAGER_ETL_START: ${ALERTMANAGER_ETL_START:-00:00}
      ALERTMANAGER_ETL_END: ${ALERTMANAGER_ETL_END:-07:00}
    # Repete o CMD da imagem para acrescentar UMA flag. O entrypoint é o
    # generate-config.sh, que termina em `exec "$@"` — então o command chega
    # inteiro ao binário.
    #
    # `--web.external-url` não é cosmético. Sem ela, o Alertmanager monta o
    # `title_link` das notificações a partir do hostname do CONTAINER, que é um
    # hex sem TLD (http://a1b2c3:9093). Dois efeitos: o link não leva a lugar
    # nenhum para quem recebe o alerta, e destinos que VALIDAM a URL recusam a
    # notificação inteira — o Discord responde 400 {"attachments": ["0"]} e o
    # Alertmanager registra "notify retry canceled due to unrecoverable error".
    # O alerta é avaliado, roteado e silenciosamente descartado no último passo.
    # Medido em 2026-07-29 com um webhook do Discord.
    command:
      - /bin/alertmanager
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    labels:
      org.brasildatahub.service: alertmanager
    volumes:
      # Silences e o estado do nflog. Perder este volume faz TODO alerta ativo
      # notificar de novo no start — e um silence de janela de ETL sumir no meio
      # da carga.
      - alertmanager_data:/alertmanager
    ports:
      # Mesma inversão do Prometheus e do Grafana: 127.0.0.1 por default. A API
      # de silences não tem autenticação; quem alcança a porta silencia o que
      # quiser.
      - "${MONITORING_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - default
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${ALERTMANAGER_MEMORY_LIMIT:-128M}
          cpus: "${ALERTMANAGER_CPU_LIMIT:-0.5}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    # Profile do COMPOSE (COMPOSE_PROFILES), não confundir com os perfis de
    # dimensionamento do repositório. Desligado no macOS pelo setup.sh por
    # duas razões medidas, não teóricas:
    #   1. o container lê o /proc da VM do Docker, não do Mac — "disco cheio" no
    #      painel significaria o disco virtual;
    #   2. o kernel da VM não traz CONFIG_PSI, então /proc/pressure não existe e
    #      o coletor `pressure` falha (node_scrape_collector_success{
    #      collector="pressure"} = 0). Em Ubuntu 22.04+/Debian 12 o PSI vem
    #      habilitado e funciona normalmente.
    profiles: [node]
    # Para enxergar os PIDs reais do host. Enfraquece o isolamento — é por isso
    # que este container não publica porta nenhuma.
    pid: host
    volumes:
      # rslave, e não apenas ro: sem a propagação, um disco montado no host
      # DEPOIS do start fica invisível, e o coletor passa a medir um filesystem
      # que não é mais o que interessa.
      - /:/host:ro,rslave
      # Textfile collector: o canal por onde processos do host publicam
      # métricas que nenhum exporter conhece. Hoje quem escreve aqui é o sidecar
      # de pgBackRest (../postgres/backup/backup-run.sh); o node_exporter só lê.
      # Bind de diretório do HOST, e não volume nomeado, porque escritor e
      # leitor vivem em projetos Compose diferentes.
      - type: bind
        source: ${NODE_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}
        target: /var/lib/node_exporter/textfile
        read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      # Sem --path.rootfs no prefixo: este caminho é o do MOUNT, não do host
      # visto por /host. Prefixá-lo faria o coletor ler um diretório inexistente
      # e publicar node_textfile_scrape_error 1 para sempre.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      # $$ escapa a interpolação do Compose. Com um único $, a regex chega VAZIA
      # ao exporter e o filtro silenciosamente não filtra nada.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      # veth/br-* nascem e morrem a cada container: sem o filtro, cada um deixa
      # uma série órfã que nunca mais recebe amostra.
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker[0-9]+)$$
      - --collector.netclass.ignored-devices=^(veth.*|br-.*|docker[0-9]+)$$
      - --collector.diskstats.device-exclude=^(ram|loop|fd|dm-|sr|nbd)\d+$$
      # Hardware e filesystems que não existem nestas máquinas.
      - --no-collector.wifi
      - --no-collector.hwmon
      - --no-collector.thermal_zone
      - --no-collector.infiniband
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.mdadm
      - --no-collector.zfs
      - --no-collector.btrfs
      - --no-collector.bonding
      - --no-collector.ipvs
      - --no-collector.fibrechannel
      - --no-collector.tapestats
      - --no-collector.selinux
      - --no-collector.dmi
      - --no-collector.rapl
      - --no-collector.edac
      - --no-collector.powersupplyclass
      # `pressure` (PSI) fica LIGADO apesar de tentador cortar: é a métrica que
      # distingue "o ETL está pesado" de "o disco saturou". Em NVMe o %util
      # satura em 100% sem o disco estar no limite; o stall time não mente.
    labels:
      org.brasildatahub.service: node-exporter
    networks:
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${NODE_EXPORTER_MEMORY_LIMIT:-128M}
          cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.5}"

  blackbox-exporter:
    image: ghcr.io/brasildatahub/blackbox-exporter:0
    restart: unless-stopped
    # Sem `profiles:` — ao contrário do node-exporter e do cAdvisor, este é o
    # único componente que mede o que o USUÁRIO experimenta, e é o substituto
    # direto dos cards de "slow requests" do Laravel Pulse. Desligá-lo por
    # default reabriria o buraco que a saída do Pulse abre.
    labels:
      org.brasildatahub.service: blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=0.0.0.0:9115
      # As sondas saem para a internet (a borda da Cloudflare, o próprio
      # domínio). O log de cada probe com falha é o que distingue "DNS não
      # resolveu" de "a origem devolveu 502" sem precisar reproduzir à mão.
      - --log.level=warn
    # Sem `ports:` — é alcançado pelo Prometheus dentro da rede bdh_metrics.
    # /probe aceita qualquer URL no parâmetro `target`: publicar esta porta
    # daria a qualquer um um proxy de requisições saindo deste host.
    networks:
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${BLACKBOX_MEMORY_LIMIT:-128M}
          cpus: "${BLACKBOX_CPU_LIMIT:-0.5}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.60.5
    restart: unless-stopped
    # DESLIGADO por default (COMPOSE_PROFILES=containers para ligar). É a única
    # forma de ver memória usada vs limite POR CONTAINER — o par que teria
    # detectado o incidente de Memory=0 de ../postgres/docs/troubleshooting.md.
    # Custa 200-400 MB de RSS e é notoriamente cardinálico, daí os filtros.
    profiles: [containers]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      # Só a nossa label vira série; as demais (incluindo as do Compose, que
      # mudam a cada deploy) ficam de fora.
      - --whitelisted_container_labels=org.brasildatahub.service
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    labels:
      org.brasildatahub.service: cadvisor
    networks:
      - bdh_metrics
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-50m}
        max-file: "${LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEMORY_LIMIT:-512M}
          cpus: "${CADVISOR_CPU_LIMIT:-1}"

volumes:
  # Volumes nomeados com driver local e `name` fixo — padrão do repositório
  # (justificativa no README da raiz). O prefixo bdh_ é o que o `bdh status`
  # filtra.
  prom_data:
    driver: local
    name: ${PROM_VOLUME:-bdh_prom_data}
  grafana_data:
    driver: local
    name: ${GRAFANA_VOLUME:-bdh_grafana_data}
  alertmanager_data:
    driver: local
    name: ${ALERTMANAGER_VOLUME:-bdh_alertmanager_data}

networks:
  # Sem `external: true` — ver a justificativa completa em
  # ../postgres/docker-compose.metrics.yml. Resumo: com external, um
  # `docker network prune` faria o `up` dos serviços de DADOS falhar.
  bdh_metrics:
    name: ${METRICS_NETWORK:-bdh_metrics}
