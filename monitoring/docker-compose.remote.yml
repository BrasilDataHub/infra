# Overlay de COLETA REMOTA — publica portas dos exporters para Prometheus noutro host.
#
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d
#
# O metrics.yml base NÃO publica porta (/metrics sem auth). Este overlay é a
# exceção consciente: proteção passa a ser firewall (ufw + DOCKER-USER → IP do par).
#
# Travas: (1) METRICS_BIND_IP obrigatória, sem default (nunca 0.0.0.0);
# (2) alerta PortaDeDadosAlcancavelDeFora cobre regressão do firewall.

services:
  node-exporter:
    ports:
      - "${METRICS_BIND_IP:?defina METRICS_BIND_IP — nunca 0.0.0.0}:${NODE_EXPORTER_PORT:-9100}:9100"

  blackbox-exporter:
    # /probe aceita qualquer URL em `target` — quem alcança tem proxy de saída.
    ports:
      - "${METRICS_BIND_IP:?defina METRICS_BIND_IP — nunca 0.0.0.0}:${BLACKBOX_PORT:-9115}:9115"
