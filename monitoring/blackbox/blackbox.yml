# blackbox_exporter — módulos de sonda HTTP/TCP/TLS.
# Alvos por domínio: targets/blackbox.json no host.

modules:
  # Classe 1 · borda: exige cf-cache-status HIT|STALE|UPDATING|REVALIDATED.
  borda_hit:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        # Sem cookie: sonda anônima (como o bot).
        Accept: "text/html,application/xhtml+xml"
      fail_if_header_not_matches:
        - header: cf-cache-status
          regexp: "^(HIT|STALE|UPDATING|REVALIDATED)$"
          allow_missing: false

  # Mesma página sem exigir HIT — separa origem lenta de borda sem cache.
  pagina_publica:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        Accept: "text/html,application/xhtml+xml"
        Cache-Control: "no-cache"

  # Classe 2 · 304: If-Modified-Since no futuro força 304 se Last-Modified existir.
  condicional_304:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [304]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        If-Modified-Since: "Fri, 01 Jan 2099 00:00:00 GMT"

  # Classes 3–4 · origem canônica (séries separadas por classe de SLO).
  empresa_por_cnpj:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        Cache-Control: "no-cache"
      # Corpo deve conter CNPJ formatado — evita 200 de página de erro.
      fail_if_body_not_matches_regexp:
        - "[0-9]{2}\\.[0-9]{3}\\.[0-9]{3}/[0-9]{4}-[0-9]{2}"

  hub_territorial:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        Cache-Control: "no-cache"

  autocomplete:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        Accept: "application/json"
      fail_if_body_not_matches_regexp:
        - "\\[|\\{"

  busca:
    prober: http
    timeout: 15s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
        Cache-Control: "no-cache"

  # Regressão: rota anônima não pode emitir Set-Cookie nem Cache-Control private.
  anonima_sem_cookie:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: bdh-blackbox/1.0
      fail_if_header_matches:
        - header: Set-Cookie
          regexp: ".+"
          allow_missing: true
        - header: Cache-Control
          regexp: "(private|no-store)"
          allow_missing: false

  # TCP puro — confirma se porta aceita conexão (guarda de firewall).
  tcp_conecta:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  tls_certificado:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200, 301, 302, 304, 403, 404]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
